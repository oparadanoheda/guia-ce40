<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variable · Código Escuela 4.0</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fbfbf8}
  body{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#1a1d24;-webkit-user-select:none;user-select:none}
  body.nocursor{cursor:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fbfbf8;overflow:hidden}
  #scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
  svg text{font-family:system-ui,"Segoe UI",Arial,sans-serif}
  .layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:44px;padding:0 140px 120px}
  #finalA .big{font-size:84px;font-weight:800;line-height:1.15;max-width:1500px;text-wrap:balance}
  #finalB .key{font-size:104px;font-weight:800;line-height:1.15;color:#2c5bbf;background:#fff;border-radius:44px;
    padding:44px 76px;box-shadow:0 14px 44px rgba(26,29,36,.12);text-wrap:balance}

  /* Subtítulos */
  #sub{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;pointer-events:none}
  body.export #sub{bottom:56px}
  #sub span{text-wrap:balance;max-width:1560px;font-size:56px;font-weight:600;line-height:1.25;color:#fff;background:rgba(26,29,36,.8);
    border-radius:20px;padding:14px 38px;text-align:center}

  /* Pantalla de inicio */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:rgba(251,251,248,.78)}
  #start h1{margin:0;font-size:132px;font-weight:800;letter-spacing:-.01em}
  #start p{margin:0;font-size:40px;color:#4a4f5c;font-weight:600}
  #bigplay{width:230px;height:230px;border-radius:50%;border:none;background:#2c5bbf;color:#fff;cursor:pointer;
    box-shadow:0 14px 40px rgba(44,91,191,.35);display:flex;align-items:center;justify-content:center}
  #bigplay svg{width:110px;height:110px;margin-left:14px}

  /* Pausa para pensar */
  #question{position:absolute;left:220px;right:220px;bottom:150px;background:#fff;border:7px solid #f5c518;border-radius:40px;
    padding:12px 40px 14px;text-align:center;box-shadow:0 16px 50px rgba(26,29,36,.22)}
  #question .tag{font-size:28px;font-weight:800;color:#6c44b0;letter-spacing:.06em;text-transform:uppercase}
  #question .q{text-wrap:balance;font-size:54px;font-weight:800;line-height:1.15;margin:2px 0 4px}
  #question .hint{font-size:28px;color:#4a4f5c;font-weight:600}

  /* Volver a ver */
  #again{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);height:96px;padding:0 48px;border:none;border-radius:48px;
    background:#2c5bbf;color:#fff;font:inherit;font-size:40px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(44,91,191,.3)}

  /* Barra de control */
  #bar{position:absolute;left:0;right:0;bottom:0;height:150px;padding:14px 40px 18px;color:#fff;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(rgba(26,29,36,0),rgba(26,29,36,.72) 28%,rgba(26,29,36,.9))}
  #bar.hidden{opacity:0;pointer-events:none}
  #track{position:relative;height:40px;cursor:pointer;touch-action:none}
  #rail{position:absolute;left:0;right:0;top:13px;height:14px;border-radius:7px;background:rgba(255,255,255,.28);overflow:hidden}
  #fill{height:100%;width:0;background:#f5c518}
  .tick{position:absolute;top:7px;width:5px;height:26px;margin-left:-2px;border-radius:3px;background:#fff;opacity:.9}
  .pm{position:absolute;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#df7619;border:3px solid #fff;display:none}
  body.pausas .pm{display:block}
  #knob{position:absolute;top:4px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #row{display:flex;align-items:center;gap:16px;height:76px}
  .cb{height:72px;min-width:72px;padding:0 18px;border:none;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;
    font:inherit;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
  .cb svg{width:36px;height:36px}
  .cb:hover{background:rgba(255,255,255,.24)}
  .cb:focus-visible,#bigplay:focus-visible,#again:focus-visible{outline:5px solid #f5c518;outline-offset:3px}
  #play{min-width:96px;background:#2c5bbf}
  #time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:190px}
  #chap{flex:1;font-size:28px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:18px;padding:4px}
  .seg .cb{height:64px;background:transparent;border-radius:14px}
  .seg .cb[aria-pressed="true"]{background:#fff;color:#1a1d24}
  #pz .sw{width:64px;height:36px;border-radius:18px;background:rgba(255,255,255,.35);position:relative;flex:none}
  #pz .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff}
  #pz[aria-checked="true"] .sw{background:#2a8f4f}
  #pz[aria-checked="true"] .sw::after{left:32px}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a1d24" flood-opacity=".14"/>
      </filter>
      <!-- Manzana (centrada en 0,0) -->
      <g id="apple">
        <path d="M0 -14C-10 -22 -26 -16 -26 0C-26 16 -14 26 -6 26C-3 26 -2 24 0 24C2 24 3 26 6 26C14 26 26 16 26 0C26 -16 10 -22 0 -14Z" fill="#cf3f36"/>
        <ellipse cx="-11" cy="-4" rx="5" ry="8" fill="#fff" opacity=".3"/>
        <path d="M0 -14Q1 -22 4 -28" fill="none" stroke="#1a1d24" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M3 -20Q14 -30 22 -22Q12 -14 3 -20Z" fill="#2a8f4f"/>
      </g>
      <!-- Meteorito morado con pinchos -->
      <g id="meteor">
        <path id="meteorSpikes" fill="#6c44b0" stroke="#6c44b0" stroke-width="3" stroke-linejoin="round"/>
        <circle r="21" fill="#6c44b0"/>
        <circle cx="-7" cy="-6" r="5" fill="#fff" opacity=".22"/>
        <circle cx="8" cy="5" r="4" fill="#fff" opacity=".22"/>
      </g>
      <g id="miniFlag"><rect x="-12" y="-14" width="4" height="28" rx="2" fill="#1a1d24"/><path d="M-8 -13C0 -17 6 -9 14 -12V2C6 5 0 -3 -8 1Z" fill="#2a8f4f"/></g>
    </defs>

    <g id="world">
      <!-- Paneles del editor -->
      <g id="panels">
        <rect x="60" y="60" width="800" height="660" rx="22" fill="#fff" stroke="#d6d9e0" stroke-width="3"/>
        <path d="M60 82Q60 60 82 60H838Q860 60 860 82V100H60Z" fill="#eceef2"/>
        <text x="84" y="81" dominant-baseline="central" font-size="28" font-weight="700" fill="#4a4f5c">Escenario</text>

        <rect x="900" y="60" width="960" height="220" rx="22" fill="#fff" stroke="#d6d9e0" stroke-width="3"/>
        <path d="M900 82Q900 60 922 60H1838Q1860 60 1860 82V100H900Z" fill="#eceef2"/>
        <text x="924" y="81" dominant-baseline="central" font-size="28" font-weight="700" fill="#4a4f5c">Variables</text>

        <rect x="900" y="300" width="560" height="420" rx="22" fill="#fff" stroke="#d6d9e0" stroke-width="3"/>
        <path d="M900 322Q900 300 922 300H1438Q1460 300 1460 322V340H900Z" fill="#eceef2"/>
        <text x="924" y="321" dominant-baseline="central" font-size="28" font-weight="700" fill="#4a4f5c">Programa</text>

        <rect x="1480" y="300" width="380" height="420" rx="22" fill="#fff" stroke="#d6d9e0" stroke-width="3"/>
        <path d="M1480 322Q1480 300 1502 300H1838Q1860 300 1860 322V340H1480Z" fill="#eceef2"/>
        <text x="1504" y="321" dominant-baseline="central" font-size="28" font-weight="700" fill="#4a4f5c">Registro</text>
        <g font-size="27" font-weight="700" fill="#6b7180">
          <text x="1500" y="372" dominant-baseline="central">suceso</text>
          <text x="1690" y="372" text-anchor="middle" dominant-baseline="central">puntos</text>
          <text x="1800" y="372" text-anchor="middle" dominant-baseline="central">vidas</text>
        </g>
        <path d="M1494 390H1846" stroke="#d6d9e0" stroke-width="3"/>
      </g>

      <!-- Escenario: isla de juego 5 × 4 -->
      <g id="island">
        <rect x="154" y="148" width="612" height="512" rx="44" fill="#4fa3d9"/>
        <rect x="190" y="184" width="540" height="440" rx="26" fill="#f2d39b"/>
        <g id="grass"></g>
      </g>
      <g id="apples"></g>
      <g id="robot"></g>
      <g id="meteors"></g>
      <g id="fx"></g>
      <g id="monitors"></g>

      <!-- Cajas de las variables -->
      <g id="boxes"></g>
      <g id="notes" font-size="28" font-weight="700" fill="#1a1d24">
        <text id="noteName" x="1250" y="131" dominant-baseline="central">← nombre: no cambia</text>
        <text id="noteVal" x="1250" y="206" dominant-baseline="central">← valor: cambia (0 → 3)</text>
      </g>

      <!-- Programa -->
      <g id="code"></g>
      <!-- Registro -->
      <g id="rows"></g>
    </g>
  </svg>

  <div id="finalA" class="layer">
    <div class="big">Una variable guarda un número que puede cambiar.</div>
  </div>
  <div id="finalB" class="layer">
    <div class="key">«La caja se llama igual; lo de dentro cambia.»</div>
  </div>

  <div id="sub" aria-live="polite"><span></span></div>

  <div id="start">
    <h1>Variable</h1>
    <button id="bigplay" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg></button>
    <p>Código Escuela 4.0 · Primaria</p>
  </div>

  <div id="question" class="hide" role="dialog" aria-live="assertive">
    <div class="tag">Pausa para pensar</div>
    <div class="q"></div>
    <div class="hint">Pulsa ▶ para continuar</div>
  </div>

  <button id="again" class="hide">↺ Volver a ver</button>

  <div id="bar">
    <div id="track" role="slider" aria-label="Progreso del vídeo" tabindex="-1">
      <div id="rail"><div id="fill"></div></div>
      <div id="marks"></div>
      <div id="knob"></div>
    </div>
    <div id="row">
      <button class="cb" id="play" aria-label="Reproducir"></button>
      <button class="cb" id="restart" aria-label="Volver a empezar" title="Volver a empezar">
        <svg viewBox="0 0 24 24"><path d="M12 5V1.5L6.5 6 12 10.5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
      </button>
      <div id="time">0:00 / 0:00</div>
      <div id="chap"></div>
      <div class="seg" role="group" aria-label="Velocidad">
        <button class="cb" data-rate="0.75" aria-pressed="false">0,75×</button>
        <button class="cb" data-rate="1" aria-pressed="true">1×</button>
      </div>
      <button class="cb" id="pz" role="switch" aria-checked="false"><span class="sw"></span>Pausas para pensar</button>
      <button class="cb" id="fs" aria-label="Pantalla completa" title="Pantalla completa">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function $(id){ return document.getElementById(id); }
  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, s, attrs){
    var a = { x: x, y: y, 'dominant-baseline': 'central' };
    for (var k in attrs) a[k] = attrs[k];
    var e = el('text', a, parent); e.textContent = s; return e;
  }
  var EXPORT = new URLSearchParams(location.search).get('export') === '1';
  if (EXPORT) document.body.classList.add('export');
  var mqRM = matchMedia('(prefers-reduced-motion: reduce)');

  /* ================= Guion: tiempos ================= */
  var DUR = 66;
  var CHAPTERS = [
    { t: 0,  titulo: 'La caja' },
    { t: 12, titulo: 'Sumar puntos' },
    { t: 36, titulo: 'Otra caja' },
    { t: 54, titulo: 'Qué es una variable' }
  ];
  var PAUSAS = [
    { t: 12, pregunta: 'Si el robot coge 3 manzanas, ¿qué número habrá en la caja?' },
    { t: 46, pregunta: 'Si choca otra vez, ¿cuántas vidas le quedan?' }
  ];
  var SUBS = [
    [0.4,  11.8, 'Una variable es una caja con nombre. Al empezar, puntos vale 0.'],
    [12.3, 29.8, 'Cada manzana: sumar 1 a puntos.'],
    [30.3, 35.8, 'La caja se llama igual. Lo de dentro cambia.'],
    [36.3, 45.8, 'Puede haber varias cajas: aquí, las vidas.'],
    [49.2, 53.8, 'Otro choque: le queda 1 vida.']
  ];

  /* ================= Utilidades ================= */
  function cl(x, a, b){ if (a === undefined) { a = 0; b = 1; } return x < a ? a : x > b ? b : x; }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function seg(t, a, b){ return cl((t - a) / (b - a)); }
  function ease(p){ return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function easeIn(p){ return p * p; }
  function win(t, a, b, f){ f = f || .15; return Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b)); }
  function tr(x, y, s, r){ return 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')' + (r ? ' rotate(' + r.toFixed(2) + ')' : '') + (s !== undefined ? ' scale(' + Math.max(s, .001).toFixed(4) + ')' : ''); }

  // Robot en versión sobria (registro superior): misma silueta y dirección, sin cara
  var ROBOT = '<ellipse cx="30" cy="54" rx="19" ry="4" fill="rgba(0,0,0,.14)"/><rect x="6" y="18" width="8" height="24" rx="2" fill="#1a1d24"/><rect x="46" y="18" width="8" height="24" rx="2" fill="#1a1d24"/><rect x="11" y="13" width="38" height="38" rx="7" fill="#2c5bbf"/><rect x="17" y="24" width="26" height="6" rx="3" fill="#1a1d24"/><circle cx="37" cy="27" r="1.8" fill="#4fa3d9"/><rect x="17" y="38" width="26" height="2" rx="1" fill="#fff" opacity=".35"/><path d="M23 13L30 3L37 13Z" fill="#f5c518"/>';

  /* ================= Escenario ================= */
  var CELL = 100;
  function CX(c){ return 160 + CELL * c; }
  function CY(r){ return 170 + CELL * r; }
  for (var r = 1; r <= 4; r++) for (var c = 1; c <= 5; c++)
    el('rect', { x: 210 + (c - 1) * CELL, y: 220 + (r - 1) * CELL, width: CELL, height: CELL,
      fill: (r + c) % 2 ? '#8fcf6e' : '#9ed97c', stroke: '#6fb24f', 'stroke-width': 2 }, $('grass'));
  (function(){
    var d = '';
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4, a1 = a - .28, a2 = a + .28;
      d += 'M' + (Math.cos(a1) * 19).toFixed(1) + ' ' + (Math.sin(a1) * 19).toFixed(1) + 'L' + (Math.cos(a) * 32).toFixed(1) + ' ' + (Math.sin(a) * 32).toFixed(1) +
           'L' + (Math.cos(a2) * 19).toFixed(1) + ' ' + (Math.sin(a2) * 19).toFixed(1) + 'Z';
    }
    $('meteorSpikes').setAttribute('d', d);
  })();

  // Robot: sale de (1,4) mirando arriba. Manzanas en (1,2), (3,2) y (3,4).
  var robotG = el('g', {}, $('robot'));
  el('g', { transform: 'scale(1.4) translate(-30 -30)' }, robotG).innerHTML = ROBOT;
  var ACTS = [
    { t0: 12.6, t1: 13.4, type: 'A' }, { t0: 13.5, t1: 14.3, type: 'A' },            // → (1,2): manzana 1
    { t0: 17.6, t1: 18.2, type: 'D' },
    { t0: 18.3, t1: 19.1, type: 'A' }, { t0: 19.2, t1: 20.0, type: 'A' },            // → (3,2): manzana 2
    { t0: 23.4, t1: 24.0, type: 'D' },
    { t0: 24.1, t1: 24.9, type: 'A' }, { t0: 25.0, t1: 25.8, type: 'A' }             // → (3,4): manzana 3
  ];
  var DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
  function pose(t){
    var x = CX(1), y = CY(4), d = 0;
    for (var i = 0; i < ACTS.length; i++) {
      var a = ACTS[i];
      if (t <= a.t0) break;
      var p = ease(seg(t, a.t0, a.t1));
      if (a.type === 'A') {
        var v = DIRS[((Math.round(d / 90) % 4) + 4) % 4], nx = x + v[0] * CELL, ny = y + v[1] * CELL;
        if (p < 1) return { x: lerp(x, nx, p), y: lerp(y, ny, p), d: d };
        x = nx; y = ny;
      } else {
        if (p < 1) return { x: x, y: y, d: d + 90 * p };
        d += 90;
      }
    }
    return { x: x, y: y, d: d };
  }
  var APPLES = [[1, 2, 14.3], [3, 2, 20.0], [3, 4, 25.8]].map(function(a){
    return { x: CX(a[0]), y: CY(a[1]), t: a[2], g: el('use', { href: '#apple' }, $('apples')),
             plus: txt($('fx'), CX(a[0]), CY(a[1]), '+1', { 'text-anchor': 'middle', 'font-size': 44, 'font-weight': 800, fill: '#2a8f4f' }) };
  });
  // Meteoritos: el primero llega por la fila 4 desde la derecha; el segundo, por la columna 3 desde arriba
  var HIT_X = CX(3), HIT_Y = CY(4);
  var METEORS = [
    { from: [CX(5) + 70, HIT_Y], show: 38.8, go: 39.4, hit: 40.8 },
    { from: [HIT_X, CY(1) - 60], show: 46.6, go: 47.4, hit: 48.8 }
  ].map(function(m){
    m.g = el('use', { href: '#meteor', transform: 'scale(1.3)' }, el('g', {}, $('meteors'))).parentNode;
    m.ring = el('circle', { cx: HIT_X, cy: HIT_Y, r: 40, fill: 'none', stroke: '#6c44b0', 'stroke-width': 6 }, $('fx'));
    m.minus = txt($('fx'), HIT_X + 70, HIT_Y - 40, '−1', { 'text-anchor': 'middle', 'font-size': 44, 'font-weight': 800, fill: '#cf3f36' });
    return m;
  });

  /* ================= Valores de las variables ================= */
  var PUNTOS = [[5.0, 0], [15.0, 1], [20.7, 2], [26.5, 3]];
  var VIDAS = [[37.3, 3], [41.5, 2], [49.5, 1]];
  function valAt(list, t){
    var cur = null, prev = null, t0 = -1;
    for (var i = 0; i < list.length; i++) if (t >= list[i][0]) { prev = cur; cur = list[i][1]; t0 = list[i][0]; }
    return { cur: cur, prev: prev, p: cur === null ? 0 : seg(t, t0, t0 + .35) };
  }

  // Monitores en el escenario (como en un editor de bloques)
  function makeMonitor(x, name){
    var g = el('g', { transform: 'translate(' + x + ' 116)' }, $('monitors'));
    el('rect', { x: 0, y: 0, width: 190, height: 46, rx: 10, fill: '#eceef2', stroke: '#c3c8d2', 'stroke-width': 2 }, g);
    txt(g, 14, 23, name, { 'font-size': 27, 'font-weight': 700, fill: '#1a1d24' });
    el('rect', { x: 118, y: 7, width: 60, height: 32, rx: 16, fill: '#ff8c1a' }, g);
    var v = txt(g, 148, 24, '', { 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 800, fill: '#1a1d24' });
    return { g: g, v: v };
  }
  var MON_P = makeMonitor(76, 'puntos'), MON_V = makeMonitor(282, 'vidas');

  // Cajas
  function makeBox(cx, name){
    var g = el('g', {}, $('boxes'));
    var tabHl = el('rect', { x: cx - 116, y: 104, width: 184, height: 52, rx: 12, fill: 'none', stroke: '#f5c518', 'stroke-width': 7 }, g);
    el('rect', { x: cx - 110, y: 110, width: 172, height: 40, rx: 10, fill: '#2c5bbf' }, g);
    txt(g, cx - 24, 131, name, { 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 800, fill: '#fff' });
    el('rect', { x: cx - 110, y: 148, width: 220, height: 116, rx: 14, fill: '#fff', stroke: '#1a1d24', 'stroke-width': 4 }, g);
    var valHl = el('rect', { x: cx - 60, y: 160, width: 120, height: 94, rx: 14, fill: 'none', stroke: '#f5c518', 'stroke-width': 7 }, g);
    var clip = el('clipPath', { id: 'clip' + name }, g);
    el('rect', { x: cx - 106, y: 152, width: 212, height: 108 }, clip);

    play: play,
    pause: pause
  };

  if (EXPORT) { bar.classList.add('hide'); startOv.classList.add('hide'); }
  setT(0);
})();
</script>
