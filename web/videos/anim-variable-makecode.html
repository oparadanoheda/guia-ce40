<!DOCTYPE html>
<html lang="es">
<head>

<title>Variable con MakeCode · Código Escuela 4.0</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fbfbf8}
  body{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#1a1d24;-webkit-user-select:none;user-select:none}
  body.nocursor{cursor:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fbfbf8;overflow:hidden}
  #scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
  svg text{font-family:system-ui,"Segoe UI",Arial,sans-serif}
  .layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:44px;padding:0 140px 120px}
  #finalA .big{font-size:84px;font-weight:800;line-height:1.15;max-width:1500px;text-wrap:balance}
  #finalB .key{font-size:104px;font-weight:800;line-height:1.15;color:#2c5bbf;background:#fff;border-radius:44px;
    padding:44px 76px;box-shadow:0 14px 44px rgba(26,29,36,.12);text-wrap:balance}

  /* Subtítulos */
  #sub{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;pointer-events:none}
  body.export #sub{bottom:56px}
  #sub span{text-wrap:balance;max-width:1560px;font-size:56px;font-weight:600;line-height:1.25;color:#fff;background:rgba(26,29,36,.8);
    border-radius:20px;padding:14px 38px;text-align:center}

  /* Pantalla de inicio */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:rgba(251,251,248,.78)}

    box-shadow:0 14px 40px rgba(44,91,191,.35);display:flex;align-items:center;justify-content:center}
  #bigplay svg{width:110px;height:110px;margin-left:14px}

  /* Pausa para pensar */
  #question{position:absolute;left:220px;right:220px;bottom:150px;background:#fff;border:7px solid #f5c518;border-radius:40px;
    padding:12px 40px 14px;text-align:center;box-shadow:0 16px 50px rgba(26,29,36,.22)}
  #question .tag{font-size:28px;font-weight:800;color:#6c44b0;letter-spacing:.06em;text-transform:uppercase}
  #question .q{text-wrap:balance;font-size:54px;font-weight:800;line-height:1.15;margin:2px 0 4px}
  #question .hint{font-size:28px;color:#4a4f5c;font-weight:600}

  /* Volver a ver */
  #again{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);height:96px;padding:0 48px;border:none;border-radius:48px;
    background:#2c5bbf;color:#fff;font:inherit;font-size:40px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(44,91,191,.3)}

  /* Barra de control */
  #bar{position:absolute;left:0;right:0;bottom:0;height:150px;padding:14px 40px 18px;color:#fff;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(rgba(26,29,36,0),rgba(26,29,36,.72) 28%,rgba(26,29,36,.9))}
  #bar.hidden{opacity:0;pointer-events:none}
  #track{position:relative;height:40px;cursor:pointer;touch-action:none}
  #rail{position:absolute;left:0;right:0;top:13px;height:14px;border-radius:7px;background:rgba(255,255,255,.28);overflow:hidden}
  #fill{height:100%;width:0;background:#f5c518}
  .tick{position:absolute;top:7px;width:5px;height:26px;margin-left:-2px;border-radius:3px;background:#fff;opacity:.9}
  .pm{position:absolute;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#df7619;border:3px solid #fff;display:none}
  body.pausas .pm{display:block}
  #knob{position:absolute;top:4px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #row{display:flex;align-items:center;gap:16px;height:76px}
  .cb{height:72px;min-width:72px;padding:0 18px;border:none;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;
    font:inherit;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
  .cb svg{width:36px;height:36px}
  .cb:hover{background:rgba(255,255,255,.24)}
  .cb:focus-visible,#bigplay:focus-visible,#again:focus-visible{outline:5px solid #f5c518;outline-offset:3px}
  #play{min-width:96px;background:#2c5bbf}
  #time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:190px}
  #chap{flex:1;font-size:28px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:18px;padding:4px}
  .seg .cb{height:64px;background:transparent;border-radius:14px}
  .seg .cb[aria-pressed="true"]{background:#fff;color:#1a1d24}
  #pz .sw,#snd .sw{width:64px;height:36px;border-radius:18px;background:rgba(255,255,255,.35);position:relative;flex:none}
  #pz .sw::after,#snd .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff}

  #pz[aria-checked="true"] .sw::after,#snd[aria-checked="true"] .sw::after{left:32px}
  .hide{display:none!important}
</style>

<body>

  <div id="finalA" class="layer">

  <div id="sub" aria-live="polite"><span></span></div>

  <div id="start">
    <h1>Variable (MakeCode)</h1>

      <button class="cb" id="snd" role="switch" aria-checked="false"><span class="sw"></span>Sonido</button>

        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

</div>
<script>
(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function $(id){ return document.getElementById(id); }
  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, s, attrs){
    var a = { x: x, y: y, 'dominant-baseline': 'central' };
    for (var k in attrs) a[k] = attrs[k];
    var e = el('text', a, parent); e.textContent = s; return e;
  }
  var EXPORT = new URLSearchParams(location.search).get('export') === '1';
  if (EXPORT) document.body.classList.add('export');
  var mqRM = matchMedia('(prefers-reduced-motion: reduce)');

  /* ================= Guion: tiempos ================= */
  // La misma idea que el vídeo «Variable» (Scratch), con la micro:bit y los bloques de MakeCode:
  // el botón A suma un punto y lo enseña en las luces; el botón B quita una vida.
  var DUR = 66;
  var CHAPTERS = [
    { t: 0,  titulo: 'La caja' },
    { t: 12, titulo: 'Sumar puntos' },
    { t: 36, titulo: 'Otra caja' },
    { t: 54, titulo: 'Qué es una variable' }
  ];
  var PAUSAS = [
    { t: 12, pregunta: 'Si se pulsa A tres veces, ¿qué número habrá en la caja?' },
    { t: 46, pregunta: 'Si se pulsa B otra vez, ¿cuántas vidas quedan?' }
  ];
  var SUBS = [
    [0.4,  11.8, 'Una variable es una caja con nombre. Al iniciar, puntos vale 0.'],
    [12.3, 29.8, 'Cada vez que se pulsa A: cambiar puntos por 1, y se ve en las luces.'],
    [30.3, 35.8, 'La caja se llama igual. Lo de dentro cambia.'],
    [36.3, 45.8, 'Puede haber varias cajas: aquí, las vidas. El botón B quita una.'],
    [49.2, 53.8, 'Otra vez B: le queda 1 vida.']
  ];
  // Pulsaciones de los botones (el valor cambia 0,4 s después y la pantalla lo enseña 0,4 s más tarde)
  var PULSA_A = [14.6, 20.3, 26.1], PULSA_B = [41.1, 49.1];
  var SONIDOS = [[1.2, 'aparece'], [36.3, 'aparece'], [60.12, 'clave']];
  PULSA_A.forEach(function(t){ SONIDOS.push([t, 'clic'], [t + .4, 'punto']); });
  PULSA_B.forEach(function(t){ SONIDOS.push([t, 'clic'], [t + .4, 'mal']); });
  SONIDOS.sort(function(a, b){ return a[0] - b[0]; });

  /* ================= Utilidades ================= */
  function cl(x, a, b){ if (a === undefined) { a = 0; b = 1; } return x < a ? a : x > b ? b : x; }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function seg(t, a, b){ return cl((t - a) / (b - a)); }
  function ease(p){ return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function win(t, a, b, f){ f = f || .15; return Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b)); }
  function measure(e){ try { return e.getComputedTextLength(); } catch (err) { return e.textContent.length * 14; } }

  /* ================= La micro:bit ================= */
  var MB = $('microbit'), CXM = 340;
  // placa
  el('rect', { x: 110, y: 200, width: 460, height: 372, rx: 34, fill: '#23262e', stroke: '#0f1115', 'stroke-width': 4, filter: 'url(#sh)' }, MB);
  // logo táctil y dos agujeros de arriba
  el('ellipse', { cx: CXM, cy: 240, rx: 30, ry: 15, fill: 'none', stroke: '#d4a940', 'stroke-width': 4 }, MB);
  el('circle', { cx: CXM - 10, cy: 240, r: 4, fill: '#d4a940' }, MB); el('circle', { cx: CXM + 10, cy: 240, r: 4, fill: '#d4a940' }, MB);
  // las 25 luces (LED) en 5 × 5
  var LX0 = CXM - 88, LY0 = 296, LSP = 44, LEDS = [];
  for (var i = 0; i < 25; i++) {
    var lx = LX0 + (i % 5) * LSP, ly = LY0 + Math.floor(i / 5) * LSP;
    var halo = el('rect', { x: lx - 8, y: ly - 8, width: 28, height: 38, rx: 9, fill: '#ff4136', opacity: 0 }, MB);
    var led = el('rect', { x: lx, y: ly, width: 12, height: 22, rx: 3, fill: '#4b4f5a' }, MB);
    LEDS.push({ led: led, halo: halo });
  }
  // botones A y B
  function boton(x, nombre){
    var g = el('g', {}, MB);
    el('rect', { x: x - 34, y: 352, width: 68, height: 68, rx: 10, fill: '#c3c8d2' }, g);
    var c = el('circle', { cx: x, cy: 386, r: 23, fill: '#1a1d24' }, g);
    txt(g, x, 326, nombre, { 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 800, fill: '#fff' });
    var anillo = el('circle', { cx: x, cy: 386, r: 46, fill: 'none', stroke: '#f5c518', 'stroke-width': 8, opacity: 0 }, g);
    return { c: c, anillo: anillo, x: x };
  }
  var BT_A = boton(176, 'A'), BT_B = boton(504, 'B');
  // conector de abajo, dorado, con los pines grandes
  el('rect', { x: 110, y: 516, width: 460, height: 56, rx: 0, fill: '#d4a940' }, MB);
  el('path', { d: 'M110 516H570V538Q570 572 536 572H144Q110 572 110 538Z', fill: '#d4a940' }, MB);
  [[150, '0'], [235, '1'], [320, '2'], [405, '3V'], [500, 'GND']].forEach(function(p){
    el('circle', { cx: p[0], cy: 536, r: 11, fill: '#23262e' }, MB);
    txt(MB, p[0], 561, p[1], { 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: '#23262e' });
  });
  for (var k = 0; k < 20; k++) el('rect', { x: 186 + k * 15.6, y: 548, width: 6, height: 24, fill: '#b8902e' }, MB);
  // +1 y −1 que suben desde la pantalla
  var FLOTA_A = PULSA_A.map(function(t){ return { t: t + .4, e: txt($('fx'), CXM + 150, 290, '+1', { 'text-anchor': 'middle', 'font-size': 46, 'font-weight': 800, fill: '#2a8f4f' }) }; });
  var FLOTA_B = PULSA_B.map(function(t){ return { t: t + .4, e: txt($('fx'), CXM + 150, 290, '−1', { 'text-anchor': 'middle', 'font-size': 46, 'font-weight': 800, fill: '#cf3f36' }) }; });
  var notaPulsa = txt($('fx'), CXM, 640, '', { 'text-anchor': 'middle', 'font-size': 32, 'font-weight': 800, fill: '#1a1d24' });
  // Las cifras de la micro:bit (5 × 5), como en su pantalla
  var CIFRAS = { 0: '.##..#..#.#..#.#..#..##..', 1: '..#...##....#....#...###.', 2: '###.....#..##..#....####.', 3: '####....#...#..#..#..##..' };
  // Lo que enseña la pantalla en cada momento: [segundo, número]
  var PANTALLA = [[5.4, 0], [15.4, 1], [21.1, 2], [26.9, 3], [41.9, 2], [49.9, 1]];

  /* ================= Valores de las variables ================= */
  var PUNTOS = [[5.0, 0], [15.0, 1], [20.7, 2], [26.5, 3]];
  var VIDAS = [[37.3, 3], [41.5, 2], [49.5, 1]];
  function valAt(list, t){
    var cur = null, prev = null, t0 = -1;
    for (var i = 0; i < list.length; i++) if (t >= list[i][0]) { prev = cur; cur = list[i][1]; t0 = list[i][0]; }
    return { cur: cur, prev: prev, p: cur === null ? 0 : seg(t, t0, t0 + .35) };
  }
  // Cajas
  function makeBox(cx, name){
    var g = el('g', {}, $('boxes'));
    var tabHl = el('rect', { x: cx - 116, y: 104, width: 184, height: 52, rx: 12, fill: 'none', stroke: '#f5c518', 'stroke-width': 7 }, g);
    el('rect', { x: cx - 110, y: 110, width: 172, height: 40, rx: 10, fill: '#2c5bbf' }, g);
    txt(g, cx - 24, 131, name, { 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 800, fill: '#fff' });
    el('rect', { x: cx - 110, y: 148, width: 220, height: 116, rx: 14, fill: '#fff', stroke: '#1a1d24', 'stroke-width': 4 }, g);
    var valHl = el('rect', { x: cx - 60, y: 160, width: 120, height: 94, rx: 14, fill: 'none', stroke: '#f5c518', 'stroke-width': 7 }, g);
    var clip = el('clipPath', { id: 'clip' + name }, g);
    el('rect', { x: cx - 106, y: 152, width: 212, height: 108 }, clip);
    var vg = el('g', { 'clip-path': 'url(#clip' + name + ')' }, g);
    var a = txt(vg, cx, 207, '', { 'text-anchor': 'middle', 'font-size': 84, 'font-weight': 800, fill: '#1a1d24' });
    var b = txt(vg, cx, 207, '', { 'text-anchor': 'middle', 'font-size': 84, 'font-weight': 800, fill: '#1a1d24' });
    return { g: g, a: a, b: b, tabHl: tabHl, valHl: valHl, cx: cx };
  }
  var BOX_P = makeBox(890, 'puntos'), BOX_V = makeBox(1290, 'vidas');

  /* ================= Bloques de MakeCode ================= */
  // Colores del editor: básico #1E90FF, entrada #D400D4, variables #DC143C. Los eventos abrazan los bloques que ejecutan.
  var COL = { bas: '#1E90FF', inp: '#D400D4', vr: '#DC143C' };
  var code = $('code');
  // una fila de partes: texto, desplegable [nombre ▾], número (0) o variable redonda (puntos)
  function fila(g, x, cy, partes, col){
    var cx = x;
    partes.forEach(function(p){
      if (typeof p === 'string') { var e = txt(g, cx, cy + 1, p, { 'font-size': 25, 'font-weight': 700, fill: '#fff' }); cx += measure(e) + 9; return; }
      if (p.drop !== undefined) {
        var r = el('rect', { x: cx, y: cy - 16, width: 10, height: 32, rx: 6, fill: 'rgba(0,0,0,.2)' }, g);
        var e2 = txt(g, cx + 10, cy + 1, p.drop + ' ▾', { 'font-size': 24, 'font-weight': 700, fill: '#fff' });
        var w2 = measure(e2) + 20; r.setAttribute('width', w2); cx += w2 + 9; return;
      }
      if (p.num !== undefined) {
        var r3 = el('rect', { x: cx, y: cy - 16, width: 10, height: 32, rx: 16, fill: '#fff' }, g);
        var e3 = txt(g, cx, cy + 1, p.num, { 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 700, fill: '#1a1d24' });
        var w3 = Math.max(42, measure(e3) + 22); r3.setAttribute('width', w3); e3.setAttribute('x', cx + w3 / 2); cx += w3 + 9; return;
      }
      if (p.v !== undefined) {
        var r4 = el('rect', { x: cx, y: cy - 17, width: 10, height: 34, rx: 17, fill: COL.vr, stroke: 'rgba(0,0,0,.25)', 'stroke-width': 1.5 }, g);
        var e4 = txt(g, cx + 14, cy + 1, p.v, { 'font-size': 24, 'font-weight': 700, fill: '#fff' });
        var w4 = measure(e4) + 28; r4.setAttribute('width', w4); cx += w4 + 9;
      }
    });
    return cx - x;
  }
  function bloque(x, y, col, partes){

  sndB.addEventListener('click', function(){ SND.set(!SND.on); sndUI(); });
  sndUI();
  var root = document.documentElement, fsB = $('fs');
  fsB.addEventListener('click', function(){
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { var req = root.requestFullscreen || root.webkitRequestFullscreen; if (req) req.call(root); }
  });
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsB.classList.add('hide');
  document.addEventListener('fullscreenchange', fit);

  // Teclado: espacio = reproducir/pausa; ← → = 5 s; Inicio = volver a empezar
  addEventListener('keydown', function(e){
    if (EXPORT || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); jump(5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(-5); }
    else if (e.key === 'Home') { e.preventDefault(); restart(); }
    else return;
    showBar();
  });
  addEventListener('keyup', function(e){ if (e.code === 'Space' || e.key === ' ') e.preventDefault(); });

  /* ================= API para la grabación ================= */
  window.ANIM = {
    duration: DUR,
    chapters: CHAPTERS,
    pausas: PAUSAS,
    seek: function(t){ playing = false; hideOverlays(); setT(+t || 0); if (T >= DUR) showEnd(); },
    play: play,
    pause: pause
  };

  if (EXPORT) { bar.classList.add('hide'); startOv.classList.add('hide'); }
  setT(0);
})();
</script>
</body>
