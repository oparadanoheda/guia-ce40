<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algoritmo · Código Escuela 4.0</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fbfbf8}
  body{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#1a1d24;-webkit-user-select:none;user-select:none}
  body.nocursor{cursor:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fbfbf8;overflow:hidden}
  #scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
  svg text{font-family:system-ui,"Segoe UI",Arial,sans-serif}
  .layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:44px;padding:0 140px 120px}
  #finalA .big{font-size:88px;font-weight:800;line-height:1.15;max-width:1500px;text-wrap:balance}
  #finalB .key{font-size:96px;font-weight:800;line-height:1.15;color:#2c5bbf;background:#fff;border-radius:44px;
    padding:44px 76px;box-shadow:0 14px 44px rgba(26,29,36,.12);text-wrap:balance}

  /* Subtítulos */
  #sub{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;pointer-events:none}
  body.export #sub{bottom:56px}
  #sub span{max-width:1560px;font-size:56px;font-weight:600;line-height:1.25;color:#fff;background:rgba(26,29,36,.8);
    border-radius:20px;padding:14px 38px;text-align:center}

  /* Pantalla de inicio */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:rgba(251,251,248,.78)}
  #start h1{margin:0;font-size:132px;font-weight:800;letter-spacing:-.01em}
  #start p{margin:0;font-size:40px;color:#4a4f5c;font-weight:600}
  #bigplay{width:230px;height:230px;border-radius:50%;border:none;background:#2c5bbf;color:#fff;cursor:pointer;
    box-shadow:0 14px 40px rgba(44,91,191,.35);display:flex;align-items:center;justify-content:center}
  #bigplay svg{width:110px;height:110px;margin-left:14px}

  /* Pausa para pensar: a la derecha de la isla, sin tapar tablero ni tarjetas */
  #question{position:absolute;left:1310px;right:40px;top:150px;background:#fff;border:7px solid #f5c518;border-radius:40px;
    padding:28px 36px 32px;text-align:center;box-shadow:0 16px 50px rgba(26,29,36,.22)}
  #question .tag{font-size:30px;font-weight:800;color:#6c44b0;letter-spacing:.06em;text-transform:uppercase}
  #question .q{font-size:60px;font-weight:800;line-height:1.15;margin:14px 0 18px;text-wrap:balance}
  #question .hint{font-size:30px;color:#4a4f5c;font-weight:600}

  /* Volver a ver */
  #again{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);height:96px;padding:0 48px;border:none;border-radius:48px;
    background:#2c5bbf;color:#fff;font:inherit;font-size:40px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(44,91,191,.3)}

  /* Barra de control */
  #bar{position:absolute;left:0;right:0;bottom:0;height:150px;padding:14px 40px 18px;color:#fff;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(rgba(26,29,36,0),rgba(26,29,36,.72) 28%,rgba(26,29,36,.9))}
  #bar.hidden{opacity:0;pointer-events:none}
  #track{position:relative;height:40px;cursor:pointer;touch-action:none}
  #rail{position:absolute;left:0;right:0;top:13px;height:14px;border-radius:7px;background:rgba(255,255,255,.28);overflow:hidden}
  #fill{height:100%;width:0;background:#f5c518}
  .tick{position:absolute;top:7px;width:5px;height:26px;margin-left:-2px;border-radius:3px;background:#fff;opacity:.9}
  .pm{position:absolute;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#df7619;border:3px solid #fff;display:none}
  body.pausas .pm{display:block}
  #knob{position:absolute;top:4px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #row{display:flex;align-items:center;gap:16px;height:76px}
  .cb{height:72px;min-width:72px;padding:0 18px;border:none;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;
    font:inherit;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
  .cb svg{width:36px;height:36px}
  .cb:hover{background:rgba(255,255,255,.24)}
  .cb:focus-visible,#bigplay:focus-visible,#again:focus-visible{outline:5px solid #f5c518;outline-offset:3px}
  #play{min-width:96px;background:#2c5bbf}
  #time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:190px}
  #chap{flex:1;font-size:28px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:18px;padding:4px}
  .seg .cb{height:64px;background:transparent;border-radius:14px}
  .seg .cb[aria-pressed="true"]{background:#fff;color:#1a1d24}
  #pz .sw,#snd .sw{width:64px;height:36px;border-radius:18px;background:rgba(255,255,255,.35);position:relative;flex:none}
  #pz .sw::after,#snd .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff}
  #pz[aria-checked="true"] .sw,#snd[aria-checked="true"] .sw{background:#2a8f4f}
  #pz[aria-checked="true"] .sw::after,#snd[aria-checked="true"] .sw::after{left:32px}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1a1d24" flood-opacity=".18"/>
      </filter>
      <radialGradient id="glowG">
        <stop offset="0" stop-color="#f5c518" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#f5c518" stop-opacity=".4"/>
        <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
      </radialGradient>
      <!-- Robot de la guía (60 × 60, centro 30,30), para el icono final -->
      <g id="robotArt"><ellipse cx="30" cy="54" rx="19" ry="4" fill="rgba(0,0,0,.18)"/><rect x="6" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="46" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="11" y="13" width="38" height="38" rx="11" fill="#2c5bbf" stroke="#1b3f8f" stroke-width="2.5"/><rect x="15" y="17" width="30" height="10" rx="5" fill="#ffffff" opacity=".18"/><path d="M22 13L30 1L38 13Z" fill="#f5c518" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/><circle cx="23" cy="29" r="5.5" fill="#fff"/><circle cx="37" cy="29" r="5.5" fill="#fff"/><circle cx="23" cy="27.5" r="2.6" fill="#1a1d24"/><circle cx="37" cy="27.5" r="2.6" fill="#1a1d24"/><path d="M23 41Q30 46 37 41" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
      <!-- Tarjeta AVANZA (120 × 120, centrada en 0,0) -->
      <g id="cardA">
        <rect x="-60" y="-60" width="120" height="120" rx="18" fill="#2c5bbf" filter="url(#sh)"/>
        <g transform="scale(.8)">
          <path d="M0 44V-6" stroke="#fff" stroke-width="22" stroke-linecap="round" fill="none"/>
          <path d="M-32 -4L0 -44L32 -4Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
        </g>
      </g>
      <!-- Tarjeta GIRA A LA DERECHA (120 × 120, centrada en 0,0) -->
      <g id="cardD">
        <rect x="-60" y="-60" width="120" height="120" rx="18" fill="#2a8f4f" filter="url(#sh)"/>
        <g transform="scale(.8)">
          <path d="M-30 46V4A26 26 0 0 1 -4 -22H8" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M4 -52L40 -22L4 8Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
        </g>
      </g>
      <path id="spark" d="M0 -14Q2 -2 14 0Q2 2 0 14Q-2 2 -14 0Q-2 -2 0 -14Z" fill="#fff"/>
    </defs>

    <g id="cam">
      <g id="world">
        <!-- Isla 5 × 5 -->
        <rect x="640" y="20" width="640" height="640" rx="54" fill="#4fa3d9"/>
        <g id="waves" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"></g>
        <rect x="686" y="66" width="548" height="548" rx="34" fill="#f2d39b"/>
        <g id="grass"></g>
        <!-- Casilla de salida -->
        <rect x="921" y="501" width="78" height="78" rx="14" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-opacity=".85"
              stroke-width="4" stroke-dasharray="10 8"/>
        <!-- Cofre (columna 3, fila 2) -->
        <g id="glow"><circle cx="0" cy="0" r="82" fill="url(#glowG)"/></g>
        <g id="sparks"></g>
        <g id="chest">
          <ellipse cx="0" cy="38" rx="46" ry="7" fill="rgba(0,0,0,.18)"/>
          <rect x="-46" y="-8" width="92" height="44" rx="8" fill="#df7619" stroke="#1a1d24" stroke-opacity=".55" stroke-width="3"/>
          <rect x="-32" y="-8" width="9" height="44" fill="#f5c518"/>
          <rect x="23" y="-8" width="9" height="44" fill="#f5c518"/>
          <g id="gold"><ellipse cx="0" cy="-8" rx="40" ry="10" fill="#f5c518" stroke="#df7619" stroke-width="3"/>
            <circle cx="-16" cy="-12" r="6" fill="#f5c518" stroke="#df7619" stroke-width="2.5"/>
            <circle cx="12" cy="-13" r="6" fill="#f5c518" stroke="#df7619" stroke-width="2.5"/></g>
          <g id="lid">
            <path d="M-46 -6V-22A18 18 0 0 1 -28 -40H28A18 18 0 0 1 46 -22V-6Z" fill="#df7619" stroke="#1a1d24" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
            <rect x="-32" y="-38" width="9" height="32" fill="#f5c518"/>
            <rect x="23" y="-38" width="9" height="32" fill="#f5c518"/>
            <rect x="-10" y="-16" width="20" height="20" rx="4" fill="#f5c518" stroke="#1a1d24" stroke-opacity=".55" stroke-width="2.5"/>
            <circle cx="0" cy="-7" r="3" fill="#1a1d24"/>
          </g>
        </g>
        <g id="robot"><g transform="scale(1.3) translate(-30 -30)">
          <ellipse cx="30" cy="54" rx="19" ry="4" fill="rgba(0,0,0,.18)"/><rect x="6" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="46" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="11" y="13" width="38" height="38" rx="11" fill="#2c5bbf" stroke="#1b3f8f" stroke-width="2.5"/><rect x="15" y="17" width="30" height="10" rx="5" fill="#ffffff" opacity=".18"/><path d="M22 13L30 1L38 13Z" fill="#f5c518" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/>
          <g id="eyes"><circle cx="23" cy="29" r="5.5" fill="#fff"/><circle cx="37" cy="29" r="5.5" fill="#fff"/><circle cx="23" cy="27.5" r="2.6" fill="#1a1d24"/><circle cx="37" cy="27.5" r="2.6" fill="#1a1d24"/></g>
          <path d="M23 41Q30 46 37 41" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        </g></g>
        <!-- Tesoro que sale del cofre -->
        <g id="gem">
          <path d="M-26 -8L-14 -24H14L26 -8L0 24Z" fill="#108394" stroke="#1a1d24" stroke-opacity=".45" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-26 -8H26M-14 -24L-6 -8L0 24M14 -24L6 -8L0 24" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
        <!-- Interrogación -->
        <g id="qb">
          <path d="M-12 32L0 50L12 32Z" fill="#fff" stroke="#6c44b0" stroke-width="4" stroke-linejoin="round"/>
          <circle r="40" fill="#fff" stroke="#6c44b0" stroke-width="4" filter="url(#sh)"/>
          <path d="M-10 33H10" stroke="#fff" stroke-width="6"/>
          <text y="2" text-anchor="middle" dominant-baseline="central" font-size="58" font-weight="800" fill="#6c44b0">?</text>
        </g>

        <!-- Programa: fila de tarjetas debajo del tablero -->
        <g id="panel">
          <rect x="690" y="672" width="540" height="146" rx="30" fill="#eceef2"/>
          <g fill="none" stroke="#c3c8d2" stroke-width="4" stroke-dasharray="12 10">
            <rect x="730" y="685" width="120" height="120" rx="18"/>
            <rect x="900" y="685" width="120" height="120" rx="18"/>
            <rect x="1070" y="685" width="120" height="120" rx="18"/>
          </g>
          <g fill="none" stroke="#a9aebb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M869 733l12 12-12 12"/><path d="M1039 733l12 12-12 12"/>
          </g>
        </g>
        <g id="cards"></g>
        <g id="confetti"></g>
      </g>
    </g>
  </svg>

  <div id="finalA" class="layer">
    <div class="big">Un algoritmo es una lista de pasos en orden.</div>
  </div>
  <div id="finalB" class="layer">
    <svg width="170" height="170" viewBox="0 0 60 60" aria-hidden="true"><use href="#robotArt"/></svg>
    <div class="key">«Un robot no adivina: hace lo que le dices.»</div>
  </div>

  <div id="sub" aria-live="polite"><span></span></div>

  <div id="start">
    <h1>Algoritmo</h1>
    <button id="bigplay" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg></button>
    <p>Código Escuela 4.0 · Primaria</p>
  </div>

  <div id="question" class="hide" role="dialog" aria-live="assertive">
    <div class="tag">Pausa para pensar</div>
    <div class="q"></div>
    <div class="hint">Pulsa ▶ para continuar</div>
  </div>

  <button id="again" class="hide">↺ Volver a ver</button>

  <div id="bar">
    <div id="track" role="slider" aria-label="Progreso del vídeo" tabindex="-1">
      <div id="rail"><div id="fill"></div></div>
      <div id="marks"></div>
      <div id="knob"></div>
    </div>
    <div id="row">
      <button class="cb" id="play" aria-label="Reproducir"></button>
      <button class="cb" id="restart" aria-label="Volver a empezar" title="Volver a empezar">
        <svg viewBox="0 0 24 24"><path d="M12 5V1.5L6.5 6 12 10.5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
      </button>
      <div id="time">0:00 / 0:00</div>
      <div id="chap"></div>
      <div class="seg" role="group" aria-label="Velocidad">
        <button class="cb" data-rate="0.75" aria-pressed="false">0,75×</button>
        <button class="cb" data-rate="1" aria-pressed="true">1×</button>
      </div>
      <button class="cb" id="snd" role="switch" aria-checked="false"><span class="sw"></span>Sonido</button>
      <button class="cb" id="pz" role="switch" aria-checked="false"><span class="sw"></span>Pausas para pensar</button>
      <button class="cb" id="fs" aria-label="Pantalla completa" title="Pantalla completa">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function $(id){ return document.getElementById(id); }
  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  var EXPORT = new URLSearchParams(location.search).get('export') === '1';
  if (EXPORT) document.body.classList.add('export');
  var mqRM = matchMedia('(prefers-reduced-motion: reduce)');

  /* ================= Guion: tiempos ================= */
  var DUR = 62;
  var CHAPTERS = [
    { t: 0,  titulo: 'El tesoro' },
    { t: 8,  titulo: 'Las instrucciones' },
    { t: 26, titulo: '¿Y si cambio una?' },
    { t: 48, titulo: 'Qué es un algoritmo' }
  ];
  var PAUSAS = [
    { t: 16, pregunta: '¿Llegará al tesoro con estas tarjetas?' },
    { t: 34, pregunta: '¿Dónde acabará ahora el robot?' }
  ];
  var SUBS = [
    [0.4,  7.8,  'El robot quiere llegar al tesoro.'],
    [8.3,  15.8, 'Le damos instrucciones, una detrás de otra.'],
    [20.4, 25.8, 'Las sigue una a una… ¡y llega!'],
    [26.3, 33.8, '¿Y si cambiamos una tarjeta?'],
    [34.3, 47.8, 'El robot no adivina: hace lo que pone.'],
    [48.4, 55.8, 'Un algoritmo es una lista de pasos en orden.']
  ];
  // Efectos de sonido: [segundo, tipo] (o [segundo, 'timbre', duración]). Los tipos están en el bloque «Sonido».
  var SONIDOS = [
    [9.3, 'aparece'], [10.9, 'aparece'], [12.5, 'aparece'], [16.88, 'paso'], [18.68, 'paso'], [20.48, 'paso'],
    [21.4, 'exito'], [30.0, 'aparece'], [34.88, 'paso'], [36.84, 'giro'], [38.88, 'paso'], [41.0, 'duda'],
    [56.22, 'clave']
  ];

  /* ================= Utilidades ================= */
  function cl(x, a, b){ if (a === undefined) { a = 0; b = 1; } return x < a ? a : x > b ? b : x; }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function seg(t, a, b){ return cl((t - a) / (b - a)); }
  function ease(p){ return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function easeOutBack(p){ var c1 = 1.3, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  function win(t, a, b, f){ f = f || .15; return Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b)); }
  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }

  /* ================= Tablero 5 × 5 ================= */
  var CELL = 100;
  function CX(c){ return 660 + CELL * c; }   // centro de la columna c (1..5)
  function CY(r){ return 40 + CELL * r; }    // centro de la fila r (1..5)
  var grass = $('grass');
  for (var r = 1; r <= 5; r++) for (var c = 1; c <= 5; c++)
    el('rect', { x: 710 + (c - 1) * CELL, y: 90 + (r - 1) * CELL, width: CELL, height: CELL,
      fill: (r + c) % 2 ? '#8fcf6e' : '#9ed97c', stroke: '#6fb24f', 'stroke-width': 2 }, grass);
  var WAVES = [[760,43],[1000,43],[1180,43],[800,637],[1120,637],[663,200],[663,470],[1257,150],[1257,380],[1257,560]].map(function(p){
    return { x: p[0], y: p[1], el: el('path', { d: 'M-16 0q8-7 16 0t16 0' }, $('waves')) };
  });

  var CHX = CX(3), CHY = CY(2);   // cofre: columna 3, fila 2
  $('chest').setAttribute('transform', 'translate(' + CHX + ' ' + CHY + ')');
  var SPARKS = [[-58, -44, 0], [56, -36, 1.4], [48, 46, .7]].map(function(s){
    return { dx: s[0], dy: s[1], ph: s[2], el: el('use', { href: '#spark' }, $('sparks')) };
  });

  /* ================= Programa del robot ================= */
  // Salida: columna 3, fila 5, mirando hacia arriba.
  var X0 = CX(3), Y0 = CY(5);
  var T1 = 16.6, D1 = 1.8;    // 1.ª ejecución: AVANZA, AVANZA, AVANZA
  var TS = 27.0;              // vuelve a la salida
  var T2 = 34.6, D2 = 2.0;    // 2.ª ejecución: AVANZA, GIRA A LA DERECHA, AVANZA
  var ACTS = [
    { t0: T1 + .15,          t1: T1 + 1.15,          type: 'A' },
    { t0: T1 + D1 + .15,     t1: T1 + D1 + 1.15,     type: 'A' },
    { t0: T1 + 2 * D1 + .15, t1: T1 + 2 * D1 + 1.15, type: 'A' },
    { t0: TS,                t1: TS + 1.6,           type: 'S' },   // vuelta a la salida (no es una tarjeta)
    { t0: T2 + .15,          t1: T2 + 1.15,          type: 'A' },
    { t0: T2 + D2 + .15,     t1: T2 + D2 + 1.05,     type: 'D' },
    { t0: T2 + 2 * D2 + .15, t1: T2 + 2 * D2 + 1.15, type: 'A' }
  ];
  var DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
  function dirv(d){ return DIRS[((Math.round(d / 90) % 4) + 4) % 4]; }
  function pose(t){
    var x = X0, y = Y0, d = 0;
    for (var i = 0; i < ACTS.length; i++) {
      var a = ACTS[i];
      if (t <= a.t0) break;
      var p = ease(seg(t, a.t0, a.t1));
      if (a.type === 'A') {
        var v = dirv(d), nx = x + v[0] * CELL, ny = y + v[1] * CELL;
        if (p < 1) return { x: lerp(x, nx, p), y: lerp(y, ny, p), d: d };
        x = nx; y = ny;
      } else if (a.type === 'D') {
        if (p < 1) return { x: x, y: y, d: d + 90 * p };
        d += 90;
      } else {
        if (p < 1) return { x: lerp(x, X0, p), y: lerp(y, Y0, p), d: d };
        x = X0; y = Y0;
      }
    }
    return { x: x, y: y, d: d };
  }

  /* ================= Tarjetas ================= */
  var CARD_X = [790, 960, 1130], CARD_Y = 745;
  function FALL(i){ return 8.8 + i * 1.6; }
  var FLIP0 = 30.0, FLIP1 = 31.0;   // la tarjeta 2 se da la vuelta
  var CARDS = [0, 1, 2].map(function(i){
    var g = el('g', {}, $('cards'));
    var flip = el('g', {}, g);
    var ua = el('use', { href: '#cardA' }, flip);
    var ud = el('use', { href: '#cardD' }, flip);
    el('circle', { cx: -54, cy: -54, r: 20, fill: '#fff', stroke: '#1a1d24', 'stroke-width': 3 }, flip);
    var tx = el('text', { x: -54, y: -53, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 26, 'font-weight': 800, fill: '#1a1d24' }, flip);
    tx.textContent = i + 1;
    var hl = el('rect', { x: -71, y: -71, width: 142, height: 142, rx: 26, fill: 'none', stroke: '#f5c518', 'stroke-width': 8 }, g);
    return { g: g, flip: flip, ua: ua, ud: ud, hl: hl };
  });

  /* ================= Confeti (semilla fija) ================= */
  var CONF_T = 21.8, CONF_COLORS = ['#cf3f36','#df7619','#2a8f4f','#108394','#2c5bbf','#6c44b0','#f5c518'];
  var R = rng(1717), CONF = [];
  for (var n = 0; n < 36; n++) {
    CONF.push({ el: el('rect', { x: -8, y: -5, width: 16, height: 10, rx: 2, fill: CONF_COLORS[n % 7] }, $('confetti')),
      vx: lerp(-380, 380, R()), vy: lerp(-700, -330, R()), r0: R() * 360, spin: lerp(-540, 540, R()), delay: R() * .25 });
  }

  /* ================= Elementos ================= */
  var cam = $('cam'), world = $('world'), robot = $('robot'), eyes = $('eyes'), glow = $('glow'), lid = $('lid'), gold = $('gold'),
      gem = $('gem'), qb = $('qb'), panel = $('panel'), finalA = $('finalA'), finalB = $('finalB'),
      subBox = $('sub'), subSpan = subBox.firstChild;
  var lastSub = null;

  /* ================= render(t): todo depende solo de t ================= */
  function render(t){
    t = cl(t, 0, DUR);
    var RM = mqRM.matches;

    // Cámara: se acerca al robot y al cofre; después, a la tarjeta 2 cuando cambia.
    var ax = 960, ay = 540, wx = 960, wy = 540, z = 1;
    if (!RM) {
      var p1 = ease(seg(t, 1.2, 4)) * (1 - ease(seg(t, 6.4, 8)));
      ay = lerp(ay, 470, p1); wy = lerp(wy, 390, p1); z = lerp(z, 1.5, p1);
      var p2 = ease(seg(t, 28.9, 29.8)) * (1 - ease(seg(t, 31.8, 32.8)));
      ay = lerp(ay, 600, p2); wy = lerp(wy, CARD_Y, p2); z = lerp(z, 1.35, p2);
    }
    cam.setAttribute('transform', 'translate(' + ax + ' ' + ay + ') scale(' + z + ') translate(' + (-wx) + ' ' + (-wy) + ')');
    world.setAttribute('opacity', 1 - seg(t, 48, 48.8));

    // Olas
    WAVES.forEach(function(w, i){
      var dx = RM ? 0 : 5 * Math.sin(t * 1.3 + i * 1.7);
      w.el.setAttribute('transform', 'translate(' + (w.x + dx) + ' ' + w.y + ')');
    });

    // Cofre: brilla siempre; se abre al llegar el robot y se cierra cuando se va
    var open = ease(seg(t, 21.4, 22.2)) * (1 - ease(seg(t, 26.2, 26.8)));
    var gp = RM ? .75 : .62 + .25 * Math.sin(t * 2 * Math.PI / 2.6);
    glow.setAttribute('transform', 'translate(' + CHX + ' ' + CHY + ') scale(' + (1 + .45 * open).toFixed(3) + ')');
    glow.setAttribute('opacity', Math.min(1, gp + .3 * open).toFixed(3));
    SPARKS.forEach(function(s){
      var k = .35 + .65 * Math.max(0, Math.sin(t * 2 * Math.PI / 2.2 + s.ph * 2));
      s.el.setAttribute('transform', 'translate(' + (CHX + s.dx) + ' ' + (CHY + s.dy) + ') scale(' + k.toFixed(3) + ')');
      s.el.setAttribute('opacity', (.9 * (1 - open)).toFixed(3));
    });
    lid.setAttribute('transform', 'translate(0 ' + (-26 * open).toFixed(2) + ') rotate(' + (-10 * open).toFixed(2) + ' -40 -8)');
    gold.setAttribute('opacity', open.toFixed(3));
    var gr = ease(seg(t, 21.6, 22.6)) * (1 - seg(t, 26.1, 26.6));
    gem.setAttribute('transform', 'translate(' + CHX + ' ' + (CHY - 20 - 72 * ease(seg(t, 21.6, 22.6))).toFixed(1) + ')');
    gem.setAttribute('opacity', gr.toFixed(3));

    // Robot (respira y parpadea)
    var P = pose(t);
    var breath = RM ? 1 : 1 + .022 * Math.sin(t * 2 * Math.PI / 2.4);
    robot.setAttribute('transform', 'translate(' + P.x.toFixed(2) + ' ' + P.y.toFixed(2) + ') rotate(' + P.d.toFixed(2) + ') scale(' + breath.toFixed(4) + ')');
    var bt = (t + 1.3) % 3.9, blink = bt < .18 ? Math.sin(Math.PI * bt / .18) : 0;
    eyes.setAttribute('transform', 'translate(0 28) scale(1 ' + (1 - .9 * blink).toFixed(3) + ') translate(0 -28)');

    // Interrogación sobre el robot cuando no llega
    var qp = ease(seg(t, 41.0, 41.8));
    qb.setAttribute('transform', 'translate(' + P.x.toFixed(2) + ' ' + (P.y - 92).toFixed(2) + ') scale(' + (RM ? 1 : .7 + .3 * qp).toFixed(3) + ')');
    qb.setAttribute('opacity', qp.toFixed(3));

    // Panel y tarjetas
    panel.setAttribute('opacity', seg(t, 8.2, 8.8));
    CARDS.forEach(function(cd, i){
      var f = FALL(i), op = 0, dy = 0;
      if (t >= f) {
        var pf = seg(t, f, f + .8);
        op = cl(pf * 2.5);
        dy = -240 * (1 - (RM ? ease(pf) : easeOutBack(pf)));
      }
      // La tarjeta 2 se da la vuelta: AVANZA → GIRA A LA DERECHA
      var sx = 1, isD = false;
      if (i === 1) {
        var pf2 = seg(t, FLIP0, FLIP1);
        sx = Math.abs(Math.cos(Math.PI * ease(pf2)));
        isD = pf2 >= .5;
      }
      cd.ua.style.display = isD ? 'none' : '';
      cd.ud.style.display = isD ? '' : 'none';
      cd.flip.setAttribute('transform', 'scale(' + Math.max(sx, .001).toFixed(4) + ' 1)');
      var h = Math.max(win(t, T1 + i * D1, T1 + (i + 1) * D1), win(t, T2 + i * D2, T2 + (i + 1) * D2));
      var sc = 1 + .06 * h;
      cd.g.setAttribute('transform', 'translate(' + CARD_X[i] + ' ' + (CARD_Y + dy).toFixed(2) + ') scale(' + sc.toFixed(4) + ')');
      cd.g.setAttribute('opacity', op.toFixed(3));
      cd.g.style.display = op > 0 ? '' : 'none';
      cd.hl.setAttribute('opacity', h.toFixed(3));
    });

    // Confeti al llegar al tesoro (no con «reducir movimiento»)
    var showConf = !RM && t > CONF_T && t < CONF_T + 2.4;
    CONF.forEach(function(c){
      var tau = t - CONF_T - c.delay;
      if (!showConf || tau <= 0) { c.el.setAttribute('opacity', 0); return; }
      var x = CHX + c.vx * tau, y = CHY - 30 + c.vy * tau + 620 * tau * tau;
      c.el.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + (c.r0 + c.spin * tau).toFixed(1) + ')');
      c.el.setAttribute('opacity', (1 - seg(tau, 1.6, 2.1)).toFixed(3));
    });

    // Textos finales
    var fa = seg(t, 48.4, 49.2) * (1 - seg(t, 55.6, 56.2));
    finalA.style.opacity = fa;
    finalA.style.transform = RM ? 'none' : 'translateY(' + (20 * (1 - seg(t, 48.4, 49.2))).toFixed(1) + 'px)';
    var fb = seg(t, 56.2, 57.0);
    finalB.style.opacity = fb;
    finalB.style.transform = RM ? 'none' : 'translateY(' + (20 * (1 - fb)).toFixed(1) + 'px)';

    // Subtítulos
    var sub = null, sop = 0;
    for (var s2 = 0; s2 < SUBS.length; s2++) {
      var S = SUBS[s2];
      if (t >= S[0] && t <= S[1]) { sub = S[2]; sop = Math.min(seg(t, S[0], S[0] + .25), 1 - seg(t, S[1] - .25, S[1])); break; }
    }
    if (sub !== lastSub) { subSpan.textContent = sub || ''; lastSub = sub; }
    subSpan.style.display = sub ? '' : 'none';
    subBox.style.opacity = sop;
  }

  /* ================= Escalado 16:9 ================= */
  var stage = $('stage');
  function fit(){
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  /* ================= Sonido: efectos sintetizados (sin archivos, sin voz, sin música) ================= */
  // Solo suena durante la reproducción, al pasar por cada instante de SONIDOS. Apagado por defecto;
  // cada navegador recuerda la elección. Nunca suena con ?export=1.
  var SND = (function(){
    var KEY = 'ce40-videos-sonido', on = false, ctx = null, comp = null, out = null, noiseBuf = null;
    try { on = localStorage.getItem(KEY) === '1'; } catch (e) { /* sin almacenamiento */ }
    function bus(){ out = ctx.createGain(); out.gain.value = .55; out.connect(comp); }
    function ac(){
      if (!ctx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        ctx = new C();
        comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
        bus();
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0), s = 7;
        for (var i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; }
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function env(g, t, a, peak, dur){
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    }
    function tone(t, f0, f1, dur, type, peak){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      env(g, t, .008, peak, dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
    }
    function noise(t, dur, freq, q, peak, ftype){
      var n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      n.buffer = noiseBuf; f.type = ftype || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      env(g, t, .004, peak, dur); n.connect(f); f.connect(g); g.connect(out); n.start(t); n.stop(t + dur + .05);
    }
    var KIT = {
      paso:    function(t){ tone(t, 620, 420, .09, 'triangle', .22); },
      giro:    function(t){ tone(t, 420, 760, .16, 'sine', .1); },
      desliza: function(t){ tone(t, 330, 560, .28, 'sine', .08); },
      aparece: function(t){ tone(t, 900, 1350, .07, 'sine', .07); },
      clic:    function(t){ noise(t, .03, 2600, 1.2, .25); tone(t, 1400, 1400, .025, 'square', .03); },
      bien:    function(t){ tone(t, 880, 880, .12, 'sine', .13); tone(t + .1, 1320, 1320, .22, 'sine', .13); },
      punto:   function(t){ tone(t, 988, 988, .08, 'square', .045); tone(t + .08, 1319, 1319, .28, 'square', .045); },
      mal:     function(t){ tone(t, 240, 120, .3, 'triangle', .2); },
      duda:    function(t){ tone(t, 440, 440, .13, 'sine', .1); tone(t + .14, 560, 560, .2, 'sine', .1); },
      exito:   function(t){ [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(t + i * .09, f, f, .35, 'triangle', .1); }); },
      clave:   function(t){ tone(t, 783.99, 783.99, 1.4, 'sine', .07); tone(t, 1174.66, 1174.66, 1.2, 'sine', .04); },
      nota:    function(t){ tone(t, 261.63, 261.63, .6, 'triangle', .25); tone(t, 523.25, 523.25, .4, 'sine', .06); },
      aplauso: function(t){ [0, .012, .03].forEach(function(d){ noise(t + d, .05, 1300, .9, .5); }); },
      luz:     function(t){ tone(t, 520, 1040, .22, 'sine', .08); tone(t + .05, 780, 1560, .2, 'sine', .04); },
      apaga:   function(t){ tone(t, 1040, 520, .22, 'sine', .07); },
      pitido:  function(t){ tone(t, 1900, 1900, .05, 'square', .025); },
      coche:   function(t){ noise(t, 1.4, 500, .7, .05, 'lowpass'); },
      cae:     function(t){ tone(t, 140, 55, .25, 'sine', .3); noise(t, .08, 300, .8, .12, 'lowpass'); },
      crack:   function(t){ noise(t, .12, 3200, 1.5, .12); },
      timbre:  function(t, dur){
        var g = ctx.createGain(), am = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.035, t + .05);
        g.gain.setValueAtTime(.035, t + dur - .25); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        am.gain.value = .5; lg.gain.value = .5; lfo.frequency.value = 22;
        lfo.connect(lg); lg.connect(am.gain); am.connect(g); g.connect(out);
        [1450, 2150].forEach(function(f){ var o = ctx.createOscillator(); o.frequency.value = f; o.connect(am); o.start(t); o.stop(t + dur + .05); });
        lfo.start(t); lfo.stop(t + dur + .05);
      }
    };
    return {
      get on(){ return on; },
      set: function(v){ on = !!v; try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) { /* sin almacenamiento */ } if (on) ac(); else this.hush(); },
      prime: function(){ if (on && !EXPORT) ac(); },
      hush: function(){ if (!ctx || !out) return; out.gain.setTargetAtTime(.0001, ctx.currentTime, .03); bus(); },
      // suena lo que hay entre a y b (solo avances normales de la reproducción, no saltos)
      cross: function(a, b, r){
        if (!on || EXPORT || !(b > a) || b - a > .3 || !ac()) return;
        SONIDOS.forEach(function(c){ if (c[0] > a && c[0] <= b && KIT[c[1]]) KIT[c[1]](ctx.currentTime + .01, (c[2] || 2) / (r || 1)); });
      }
    };
  })();

  /* ================= Reproductor ================= */
  var T = 0, playing = false, rate = 1, pausasOn = false, last = null;
  var bar = $('bar'), playB = $('play'), startOv = $('start'), qBox = $('question'), againB = $('again');
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>';

  function fmt(s){ s = Math.floor(s + 1e-6); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  var marks = $('marks');
  CHAPTERS.forEach(function(c){
    if (c.t === 0) return;
    var d = document.createElement('div'); d.className = 'tick'; d.style.left = (c.t / DUR * 100) + '%'; d.title = c.titulo; marks.appendChild(d);
  });
  PAUSAS.forEach(function(p){
    var d = document.createElement('div'); d.className = 'pm'; d.style.left = (p.t / DUR * 100) + '%'; d.title = p.pregunta; marks.appendChild(d);
  });

  var lastIcon = null;
  function ui(){
    var icon = playing ? 'pause' : 'play';
    if (icon !== lastIcon) {
      playB.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
      playB.setAttribute('aria-label', playing ? 'Pausa' : 'Reproducir');
      lastIcon = icon;
    }
    var pct = (T / DUR * 100) + '%';
    $('fill').style.width = pct; $('knob').style.left = pct;
    $('time').textContent = fmt(T) + ' / ' + fmt(DUR);
    var ch = CHAPTERS[0];
    CHAPTERS.forEach(function(c){ if (T >= c.t) ch = c; });
    $('chap').textContent = ch.titulo;
    $('track').setAttribute('aria-valuenow', Math.round(T));
  }
  function setT(x){ var a = T; T = cl(x, 0, DUR); render(T); ui(); if (playing) SND.cross(a, T, rate); }

  function hideOverlays(){ startOv.classList.add('hide'); qBox.classList.add('hide'); againB.classList.add('hide'); }
  function showEnd(){ if (!EXPORT) againB.classList.remove('hide'); }

  function play(){
    if (playing) return;
    if (T >= DUR - 1e-3) T = 0;
    SND.prime();
    hideOverlays();
    playing = true; last = null; ui(); showBar();
    requestAnimationFrame(tick);
  }
  function pause(){ playing = false; SND.hush(); ui(); showBar(); }
  function toggle(){ playing ? pause() : play(); }
  function tick(now){
    if (!playing) return;
    if (last === null) last = now;
    var dt = Math.min(.1, (now - last) / 1000) * rate;
    last = now;
    var nt = T + dt;
    if (pausasOn && !EXPORT) {
      for (var i = 0; i < PAUSAS.length; i++) {
        var p = PAUSAS[i];
        if (T < p.t && nt >= p.t) {
          setT(p.t); playing = false; ui();
          qBox.querySelector('.q').textContent = p.pregunta;
          qBox.classList.remove('hide');
          showBar();
          return;
        }
      }
    }
    if (nt >= DUR) { setT(DUR); playing = false; ui(); showEnd(); showBar(); return; }
    setT(nt);
    if (barShown && !overBar && performance.now() > hideAt) hideBar();
    requestAnimationFrame(tick);
  }
  function jump(d){
    hideOverlays();
    setT(T + d);
    if (!playing && T >= DUR) showEnd();
  }
  function restart(){ hideOverlays(); setT(0); playing = false; play(); }

  // Barra que se oculta sola mientras se reproduce
  var barShown = true, hideAt = 0, overBar = false;
  function showBar(){
    if (EXPORT) return;
    bar.classList.remove('hidden'); document.body.classList.remove('nocursor');
    barShown = true; hideAt = performance.now() + 2600;
  }
  function hideBar(){
    if (!playing) return;
    bar.classList.add('hidden'); document.body.classList.add('nocursor'); barShown = false;
  }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(function(ev){ document.addEventListener(ev, showBar, { passive: true }); });
  bar.addEventListener('pointerenter', function(){ overBar = true; });
  bar.addEventListener('pointerleave', function(){ overBar = false; showBar(); });

  // Barra de progreso: tocar o arrastrar
  var track = $('track'), dragging = false, wasPlaying = false;
  function seekFromEvent(e){
    var r = track.getBoundingClientRect();
    setT(cl((e.clientX - r.left) / r.width) * DUR);
  }
  track.addEventListener('pointerdown', function(e){
    dragging = true; wasPlaying = playing; playing = false; SND.hush();
    hideOverlays(); track.setPointerCapture(e.pointerId); seekFromEvent(e);
  });
  track.addEventListener('pointermove', function(e){ if (dragging) seekFromEvent(e); });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    if (wasPlaying && T < DUR) play(); else { ui(); if (T >= DUR) showEnd(); }
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  // Botones
  playB.addEventListener('click', toggle);
  $('bigplay').addEventListener('click', play);
  $('restart').addEventListener('click', restart);
  againB.addEventListener('click', restart);
  Array.prototype.forEach.call(document.querySelectorAll('.seg .cb'), function(b){
    b.addEventListener('click', function(){
      rate = parseFloat(b.getAttribute('data-rate'));
      Array.prototype.forEach.call(document.querySelectorAll('.seg .cb'), function(o){ o.setAttribute('aria-pressed', o === b); });
    });
  });
  var pz = $('pz');
  pz.addEventListener('click', function(){
    pausasOn = !pausasOn;
    pz.setAttribute('aria-checked', pausasOn);
    document.body.classList.toggle('pausas', pausasOn);
    if (!pausasOn) qBox.classList.add('hide');
  });
  var sndB = $('snd');
  function sndUI(){ sndB.setAttribute('aria-checked', SND.on); }
  sndB.addEventListener('click', function(){ SND.set(!SND.on); sndUI(); });
  sndUI();
  var root = document.documentElement, fsB = $('fs');
  fsB.addEventListener('click', function(){
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { var req = root.requestFullscreen || root.webkitRequestFullscreen; if (req) req.call(root); }
  });
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsB.classList.add('hide');
  document.addEventListener('fullscreenchange', fit);

  // Teclado: espacio = reproducir/pausa; ← → = 5 s; Inicio = volver a empezar
  addEventListener('keydown', function(e){
    if (EXPORT || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); jump(5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(-5); }
    else if (e.key === 'Home') { e.preventDefault(); restart(); }
    else return;
    showBar();
  });
  addEventListener('keyup', function(e){ if (e.code === 'Space' || e.key === ' ') e.preventDefault(); });

  /* ================= API para la grabación ================= */
  window.ANIM = {
    duration: DUR,
    chapters: CHAPTERS,
    pausas: PAUSAS,
    seek: function(t){ playing = false; hideOverlays(); setT(+t || 0); if (T >= DUR) showEnd(); },
    play: play,
    pause: pause
  };

  if (EXPORT) { bar.classList.add('hide'); startOv.classList.add('hide'); }
  setT(0);
})();
</script>
</body>
</html>
