<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descomponer · Código Escuela 4.0</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fbfbf8}
  body{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#1a1d24;-webkit-user-select:none;user-select:none}
  body.nocursor{cursor:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fbfbf8;overflow:hidden}
  #scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
  svg text{font-family:system-ui,"Segoe UI",Arial,sans-serif}
  .layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:44px;padding:0 140px 120px}
  #finalA .big{font-size:84px;font-weight:800;line-height:1.15;max-width:1500px;text-wrap:balance}
  #finalB .key{font-size:104px;font-weight:800;line-height:1.15;color:#2c5bbf;background:#fff;border-radius:44px;
    padding:44px 76px;box-shadow:0 14px 44px rgba(26,29,36,.12);text-wrap:balance}

  /* Subtítulos */
  #sub{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;pointer-events:none}
  body.export #sub{bottom:56px}
  #sub span{max-width:1560px;font-size:56px;font-weight:600;line-height:1.25;color:#fff;background:rgba(26,29,36,.8);
    border-radius:20px;padding:14px 38px;text-align:center}

  /* Pantalla de inicio */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:rgba(251,251,248,.78)}
  #start h1{margin:0;font-size:132px;font-weight:800;letter-spacing:-.01em}
  #start p{margin:0;font-size:40px;color:#4a4f5c;font-weight:600}
  #bigplay{width:230px;height:230px;border-radius:50%;border:none;background:#2c5bbf;color:#fff;cursor:pointer;
    box-shadow:0 14px 40px rgba(44,91,191,.35);display:flex;align-items:center;justify-content:center}
  #bigplay svg{width:110px;height:110px;margin-left:14px}

  /* Pausa para pensar */
  #question{position:absolute;left:260px;right:260px;bottom:170px;background:#fff;border:7px solid #f5c518;border-radius:40px;
    padding:26px 50px 30px;text-align:center;box-shadow:0 16px 50px rgba(26,29,36,.22)}
  #question .tag{font-size:32px;font-weight:800;color:#6c44b0;letter-spacing:.06em;text-transform:uppercase}
  #question .q{font-size:70px;font-weight:800;line-height:1.15;margin:10px 0 12px}
  #question .hint{font-size:32px;color:#4a4f5c;font-weight:600}

  /* Volver a ver */
  #again{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);height:96px;padding:0 48px;border:none;border-radius:48px;
    background:#2c5bbf;color:#fff;font:inherit;font-size:40px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(44,91,191,.3)}

  /* Barra de control */
  #bar{position:absolute;left:0;right:0;bottom:0;height:150px;padding:14px 40px 18px;color:#fff;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(rgba(26,29,36,0),rgba(26,29,36,.72) 28%,rgba(26,29,36,.9))}
  #bar.hidden{opacity:0;pointer-events:none}
  #track{position:relative;height:40px;cursor:pointer;touch-action:none}
  #rail{position:absolute;left:0;right:0;top:13px;height:14px;border-radius:7px;background:rgba(255,255,255,.28);overflow:hidden}
  #fill{height:100%;width:0;background:#f5c518}
  .tick{position:absolute;top:7px;width:5px;height:26px;margin-left:-2px;border-radius:3px;background:#fff;opacity:.9}
  .pm{position:absolute;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#df7619;border:3px solid #fff;display:none}
  body.pausas .pm{display:block}
  #knob{position:absolute;top:4px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #row{display:flex;align-items:center;gap:16px;height:76px}
  .cb{height:72px;min-width:72px;padding:0 18px;border:none;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;
    font:inherit;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
  .cb svg{width:36px;height:36px}
  .cb:hover{background:rgba(255,255,255,.24)}
  .cb:focus-visible,#bigplay:focus-visible,#again:focus-visible{outline:5px solid #f5c518;outline-offset:3px}
  #play{min-width:96px;background:#2c5bbf}
  #time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:190px}
  #chap{flex:1;font-size:28px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:18px;padding:4px}
  .seg .cb{height:64px;background:transparent;border-radius:14px}
  .seg .cb[aria-pressed="true"]{background:#fff;color:#1a1d24}
  #pz .sw{width:64px;height:36px;border-radius:18px;background:rgba(255,255,255,.35);position:relative;flex:none}
  #pz .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff}
  #pz[aria-checked="true"] .sw{background:#2a8f4f}
  #pz[aria-checked="true"] .sw::after{left:32px}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1a1d24" flood-opacity=".18"/>
      </filter>
      <!-- Robot de la guía (60 × 60, centro 30,30) -->
      <g id="robotArt"><ellipse cx="30" cy="54" rx="19" ry="4" fill="rgba(0,0,0,.18)"/><rect x="6" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="46" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="11" y="13" width="38" height="38" rx="11" fill="#2c5bbf" stroke="#1b3f8f" stroke-width="2.5"/><rect x="15" y="17" width="30" height="10" rx="5" fill="#ffffff" opacity=".18"/><path d="M22 13L30 1L38 13Z" fill="#f5c518" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/><circle cx="23" cy="29" r="5.5" fill="#fff"/><circle cx="37" cy="29" r="5.5" fill="#fff"/><circle cx="23" cy="27.5" r="2.6" fill="#1a1d24"/><circle cx="37" cy="27.5" r="2.6" fill="#1a1d24"/><path d="M23 41Q30 46 37 41" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
      <!-- Manzana (centrada en 0,0, unos 52 × 56) -->
      <g id="apple">
        <path d="M0 -14C-10 -22 -26 -16 -26 0C-26 16 -14 26 -6 26C-3 26 -2 24 0 24C2 24 3 26 6 26C14 26 26 16 26 0C26 -16 10 -22 0 -14Z" fill="#cf3f36"/>
        <ellipse cx="-11" cy="-4" rx="5" ry="8" fill="#fff" opacity=".3"/>
        <path d="M0 -14Q1 -22 4 -28" fill="none" stroke="#1a1d24" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M3 -20Q14 -30 22 -22Q12 -14 3 -20Z" fill="#2a8f4f"/>
      </g>
      <!-- Meteorito morado con pinchos (centrado en 0,0) -->
      <g id="meteor">
        <path id="meteorSpikes" fill="#6c44b0" stroke="#6c44b0" stroke-width="3" stroke-linejoin="round"/>
        <circle r="21" fill="#6c44b0"/>
        <circle cx="-7" cy="-6" r="5" fill="#fff" opacity=".22"/>
        <circle cx="8" cy="5" r="4" fill="#fff" opacity=".22"/>
        <circle cx="-3" cy="10" r="3" fill="#fff" opacity=".22"/>
      </g>
      <!-- Bandera (meta) -->
      <g id="flag">
        <rect x="-16" y="-26" width="5" height="52" rx="2.5" fill="#1a1d24"/>
        <path d="M-11 -24H20L13 -13L20 -2H-11Z" fill="#f5c518" stroke="#df7619" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <!-- Marcador -->
      <g id="ptsIcon">
        <rect x="-30" y="-20" width="60" height="40" rx="14" fill="#fff" stroke="#1a1d24" stroke-width="3"/>
        <text y="1" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="800" fill="#1a1d24">0</text>
      </g>
      <!-- Tic verde -->
      <g id="tick">
        <circle r="22" fill="#2a8f4f" stroke="#fff" stroke-width="4"/>
        <path d="M-10 0L-3 8L11 -8" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <path id="spark" d="M0 -14Q2 -2 14 0Q2 2 0 14Q-2 2 -14 0Q-2 -2 0 -14Z"/>
      <clipPath id="scrClip"><rect x="1214" y="134" width="624" height="468" rx="14"/></clipPath>
    </defs>

    <g id="cam">
      <g id="world">
        <!-- Robot narrador -->
        <g id="narr"></g>
        <g id="sweat" fill="#108394">
          <path id="drop1" d="M0 -12Q8 0 6 6A6 6 0 0 1 -6 6Q-8 0 0 -12Z"/>
          <path id="drop2" d="M0 -12Q8 0 6 6A6 6 0 0 1 -6 6Q-8 0 0 -12Z"/>
        </g>

        <!-- Líneas que unen el problema con sus piezas -->
        <g id="lines" fill="none" stroke="#2a8f4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></g>

        <!-- Bloque grande: HACER UN VIDEOJUEGO -->
        <g id="block">
          <rect x="-520" y="-120" width="1040" height="240" rx="40" fill="#2a8f4f" filter="url(#sh)"/>
          <text y="4" text-anchor="middle" dominant-baseline="central" font-size="80" font-weight="800" fill="#fff">HACER UN VIDEOJUEGO</text>
          <g id="cracks" fill="none" stroke="#fbfbf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></g>
          <use id="topTick" href="#tick" />
        </g>

        <!-- Piezas -->
        <g id="pieces"></g>
        <g id="sparks"></g>

        <!-- Pantalla de juego -->
        <g id="screen">
          <rect x="1440" y="626" width="170" height="20" rx="6" fill="#1a1d24"/>
          <rect x="1380" y="642" width="290" height="16" rx="8" fill="#1a1d24"/>
          <rect x="1190" y="110" width="672" height="516" rx="36" fill="#1a1d24" filter="url(#sh)"/>
          <g clip-path="url(#scrClip)">
            <g id="scrGrass"></g>
            <g id="gMeteor"><use href="#meteor" transform="scale(1.7)"/></g>
            <g id="gApple"><use href="#apple" transform="scale(1.4)"/></g>
            <g id="gAppleSpark" fill="#f5c518"></g>
            <g id="gRobot"></g>
            <g id="gPts">
              <rect x="1232" y="150" width="232" height="56" rx="28" fill="#fff" stroke="#d6d9e0" stroke-width="3"/>
              <rect id="gPtsHl" x="1226" y="144" width="244" height="68" rx="34" fill="none" stroke="#f5c518" stroke-width="7"/>
              <text id="gPtsT" x="1348" y="179" text-anchor="middle" dominant-baseline="central" font-size="36" font-weight="800" fill="#1a1d24"></text>
            </g>
            <g id="gWin">
              <rect x="-230" y="-56" width="460" height="112" rx="28" fill="#f5c518" stroke="#df7619" stroke-width="5" filter="url(#sh)"/>
              <text y="3" text-anchor="middle" dominant-baseline="central" font-size="56" font-weight="800" fill="#1a1d24">¡Has ganado!</text>
            </g>
            <g id="sconf"></g>
          </g>
        </g>
      </g>
    </g>
  </svg>

  <div id="finalA" class="layer">
    <div class="big">Descomponer es partir un problema grande en partes pequeñas.</div>
  </div>
  <div id="finalB" class="layer">
    <svg width="170" height="170" viewBox="0 0 60 60" aria-hidden="true"><use href="#robotArt"/></svg>
    <div class="key">«Paso a paso, todo es más fácil.»</div>
  </div>

  <div id="sub" aria-live="polite"><span></span></div>

  <div id="start">
    <h1>Descomponer</h1>
    <button id="bigplay" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg></button>
    <p>Código Escuela 4.0 · Primaria</p>
  </div>

  <div id="question" class="hide" role="dialog" aria-live="assertive">
    <div class="tag">Pausa para pensar</div>
    <div class="q"></div>
    <div class="hint">Pulsa ▶ para continuar</div>
  </div>

  <button id="again" class="hide">↺ Volver a ver</button>

  <div id="bar">
    <div id="track" role="slider" aria-label="Progreso del vídeo" tabindex="-1">
      <div id="rail"><div id="fill"></div></div>
      <div id="marks"></div>
      <div id="knob"></div>
    </div>
    <div id="row">
      <button class="cb" id="play" aria-label="Reproducir"></button>
      <button class="cb" id="restart" aria-label="Volver a empezar" title="Volver a empezar">
        <svg viewBox="0 0 24 24"><path d="M12 5V1.5L6.5 6 12 10.5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
      </button>
      <div id="time">0:00 / 0:00</div>
      <div id="chap"></div>
      <div class="seg" role="group" aria-label="Velocidad">
        <button class="cb" data-rate="0.75" aria-pressed="false">0,75×</button>
        <button class="cb" data-rate="1" aria-pressed="true">1×</button>
      </div>
      <button class="cb" id="pz" role="switch" aria-checked="false"><span class="sw"></span>Pausas para pensar</button>
      <button class="cb" id="fs" aria-label="Pantalla completa" title="Pantalla completa">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function $(id){ return document.getElementById(id); }
  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  var EXPORT = new URLSearchParams(location.search).get('export') === '1';
  if (EXPORT) document.body.classList.add('export');
  var mqRM = matchMedia('(prefers-reduced-motion: reduce)');

  /* ================= Guion: tiempos ================= */
  var DUR = 56;
  var CHAPTERS = [
    { t: 0,  titulo: 'El problema' },
    { t: 10, titulo: 'Lo partimos' },
    { t: 20, titulo: 'Una parte cada vez' },
    { t: 44, titulo: 'Qué es descomponer' }
  ];
  var PAUSAS = [
    { t: 10, pregunta: '¿Qué partes tiene un videojuego?' },
    { t: 36, pregunta: '¿Qué pasará al juntar todas las piezas?' }
  ];
  var SUBS = [
    [0.4,  9.8,  'Queremos hacer un videojuego. ¡Es mucho de golpe!'],
    [10.3, 19.8, 'Lo partimos en piezas pequeñas.'],
    [20.3, 35.8, 'Hacemos una pieza cada vez.'],
    [39.5, 43.8, 'Al juntarlas, el juego está hecho.']
  ];

  /* ================= Utilidades ================= */
  function cl(x, a, b){ if (a === undefined) { a = 0; b = 1; } return x < a ? a : x > b ? b : x; }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function seg(t, a, b){ return cl((t - a) / (b - a)); }
  function ease(p){ return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function easeOutBack(p){ var c1 = 1.3, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  function win(t, a, b, f){ f = f || .15; return Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b)); }
  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
  function tr(x, y, s, r){ return 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')' + (r ? ' rotate(' + r.toFixed(2) + ')' : '') + (s !== undefined ? ' scale(' + Math.max(s, .001).toFixed(4) + ')' : ''); }

  // Robot (con ojos que parpadean)
  var ROBOT = '<ellipse cx="30" cy="54" rx="19" ry="4" fill="rgba(0,0,0,.18)"/><rect x="6" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="46" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="11" y="13" width="38" height="38" rx="11" fill="#2c5bbf" stroke="#1b3f8f" stroke-width="2.5"/><rect x="15" y="17" width="30" height="10" rx="5" fill="#ffffff" opacity=".18"/><path d="M22 13L30 1L38 13Z" fill="#f5c518" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/>' +
    '<g class="eyes"><circle cx="23" cy="29" r="5.5" fill="#fff"/><circle cx="37" cy="29" r="5.5" fill="#fff"/><circle cx="23" cy="27.5" r="2.6" fill="#1a1d24"/><circle cx="37" cy="27.5" r="2.6" fill="#1a1d24"/></g>' +
    '<path d="M23 41Q30 46 37 41" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>';
  function makeRobot(parent, s){
    var g = el('g', {}, parent);
    var inner = el('g', { transform: 'scale(' + s + ') translate(-30 -30)' }, g);
    inner.innerHTML = ROBOT;
    return { g: g, eyes: inner.querySelector('.eyes') };
  }
  function blink(t, off){
    var bt = (t + off) % 3.9, b = bt < .18 ? Math.sin(Math.PI * bt / .18) : 0;
    return 'translate(0 28) scale(1 ' + (1 - .9 * b).toFixed(3) + ') translate(0 -28)';
  }

  /* ================= Construcción ================= */
  // Pinchos del meteorito
  (function(){
    var d = '';
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4, a1 = a - .28, a2 = a + .28;
      d += 'M' + (Math.cos(a1) * 19).toFixed(1) + ' ' + (Math.sin(a1) * 19).toFixed(1) +
           'L' + (Math.cos(a) * 32).toFixed(1) + ' ' + (Math.sin(a) * 32).toFixed(1) +
           'L' + (Math.cos(a2) * 19).toFixed(1) + ' ' + (Math.sin(a2) * 19).toFixed(1) + 'Z';
    }
    $('meteorSpikes').setAttribute('d', d);
  })();

  var NARR = makeRobot($('narr'), 2.1);       // robot narrador
  var NX = 960, NY = 640;

  // Grietas del bloque (en las fronteras entre las 5 piezas)
  [-312, -104, 104, 312].forEach(function(x, k){
    el('path', { d: 'M' + x + ' -120l' + (k % 2 ? -14 : 14) + ' 40l' + (k % 2 ? 20 : -20) + ' 40l' + (k % 2 ? -16 : 16) + ' 40l' + (k % 2 ? 14 : -14) + ' 40l' + (k % 2 ? -18 : 18) + ' 40l' + (k % 2 ? 14 : -14) + ' 40' }, $('cracks'));
  });
  $('topTick').setAttribute('transform', 'translate(500 -100) scale(1.6)');

  // Piezas: Personaje, Premio, Enemigo, Puntos, Final
  var NAMES = ['Personaje', 'Premio', 'Enemigo', 'Puntos', 'Final'];
  var ICONS = ['robot', '#apple', '#meteor', '#ptsIcon', '#flag'];
  var TOP = { x: 590, y: 150, s: .54 };      // posición del problema ya partido
  var PIECE_Y = 435, PW = 196, PH = 150;
  function PX(i){ return 590 + (i - 2) * 215; }
  function APPEAR(i){ return 12.4 + i * .6; }   // salen del bloque
  function WORK(i){ return 20.8 + i * 3; }      // se completan
  var PIECES = NAMES.map(function(name, i){
    var line = el('path', { d: 'M590 215V290H' + PX(i) + 'V360', pathLength: 1, 'stroke-dasharray': '1 1' }, $('lines'));
    var g = el('g', {}, $('pieces'));
    var hl = el('rect', { x: -PW / 2 - 12, y: -PH / 2 - 12, width: PW + 24, height: PH + 24, rx: 34, fill: 'none', stroke: '#f5c518', 'stroke-width': 8 }, g);
    el('rect', { x: -PW / 2, y: -PH / 2, width: PW, height: PH, rx: 24, fill: '#fff', stroke: '#2a8f4f', 'stroke-width': 4, 'stroke-dasharray': '12 9', filter: 'url(#sh)' }, g);
    var done = el('rect', { x: -PW / 2, y: -PH / 2, width: PW, height: PH, rx: 24, fill: '#2a8f4f' }, g);
    var icon = el('g', { transform: 'translate(0 -26)' }, g);
    if (ICONS[i] === 'robot') { var r = makeRobot(icon, 1.15); r.g.setAttribute('transform', 'translate(0 3)'); }
    else el('use', { href: ICONS[i], transform: 'scale(' + (i === 2 ? 1.05 : 1.2) + ')' }, icon);
    var t1 = el('text', { y: 44, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 34, 'font-weight': 800, fill: '#2a8f4f' }, g);
    var t2 = el('text', { y: 44, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 34, 'font-weight': 800, fill: '#fff' }, g);
    t1.textContent = t2.textContent = name;
    var tick = el('use', { href: '#tick' }, g);
    var spark = el('circle', { r: 13, fill: '#f5c518', stroke: '#fff', 'stroke-width': 4 }, $('sparks'));
    return { line: line, g: g, hl: hl, done: done, icon: icon, t1: t1, t2: t2, tick: tick, spark: spark };
  });

  // Pantalla de juego
  for (var gr = 0; gr < 6; gr++) for (var gc = 0; gc < 8; gc++)
    el('rect', { x: 1214 + gc * 78, y: 134 + gr * 78, width: 78, height: 78, fill: (gr + gc) % 2 ? '#8fcf6e' : '#9ed97c' }, $('scrGrass'));
  var GROBOT = makeRobot($('gRobot'), 1.45);
  var SCR = { cx: 1526, cy: 368 };
  var TARGET = [[1331, 485], [1721, 485], [1610, 222], [1348, 178], [1526, 372]];
  var APPLE_SPARKS = [0, 1, 2, 3, 4, 5].map(function(){ return el('use', { href: '#spark' }, $('gAppleSpark')); });

  // Confeti dentro de la pantalla (semilla fija)
  var CONF_T = 41.2, CONF_COLORS = ['#cf3f36','#df7619','#2a8f4f','#108394','#2c5bbf','#6c44b0','#f5c518'];
  var R = rng(2024), CONF = [];
  for (var n = 0; n < 28; n++) {
    CONF.push({ el: el('rect', { x: -7, y: -4, width: 14, height: 8, rx: 2, fill: CONF_COLORS[n % 7] }, $('sconf')),
      vx: lerp(-330, 330, R()), vy: lerp(-560, -260, R()), r0: R() * 360, spin: lerp(-540, 540, R()), delay: R() * .2 });
  }

  /* ================= Elementos ================= */
  var cam = $('cam'), world = $('world'), block = $('block'), cracks = $('cracks'), topTick = $('topTick'),
      sweat = $('sweat'), drop1 = $('drop1'), drop2 = $('drop2'), screen = $('screen'),
      gMeteor = $('gMeteor'), gApple = $('gApple'), gPts = $('gPts'), gPtsT = $('gPtsT'), gPtsHl = $('gPtsHl'), gWin = $('gWin'),
      finalA = $('finalA'), finalB = $('finalB'), subBox = $('sub'), subSpan = subBox.firstChild;
  var lastSub = null, lastPts = null;

  /* ================= render(t): todo depende solo de t ================= */
  function render(t){
    t = cl(t, 0, DUR);
    var RM = mqRM.matches;

    // Cámara: se acerca un poco al bloque mientras el robot lo mira
    var z = 1;
    if (!RM) z = 1 + .06 * ease(seg(t, 1.8, 9.4)) * (1 - ease(seg(t, 10.2, 11.2)));
    cam.setAttribute('transform', 'translate(960 420) scale(' + z.toFixed(4) + ') translate(-960 -420)');
    world.setAttribute('opacity', 1 - seg(t, 44, 44.8));

    // Robot narrador: mira el bloque, agobiado; se retira al partirlo
    var narrOp = seg(t, 0, .01) * (1 - seg(t, 10.4, 11));
    var breath = RM ? 1 : 1 + .022 * Math.sin(t * 2 * Math.PI / 2.4);
    NARR.g.setAttribute('transform', tr(NX, NY, breath));
    NARR.g.setAttribute('opacity', narrOp.toFixed(3));
    NARR.eyes.setAttribute('transform', blink(t, 1.3));
    var sw = seg(t, 2.6, 3.2) * (1 - seg(t, 10.2, 10.8));
    sweat.setAttribute('opacity', sw.toFixed(3));
    var c1 = RM ? .4 : (t * .7) % 1, c2 = RM ? .7 : (t * .7 + .5) % 1;
    drop1.setAttribute('transform', tr(NX + 78, NY - 58 + 26 * c1, 1.1));
    drop1.setAttribute('opacity', RM ? 1 : (1 - c1).toFixed(3));
    drop2.setAttribute('transform', tr(NX - 80, NY - 44 + 26 * c2, .9));
    drop2.setAttribute('opacity', RM ? 1 : (1 - c2).toFixed(3));

    // Bloque grande: cae, tiembla, se agrieta y sube a lo alto del esquema
    var fp = seg(t, .6, 1.5);
    var by = lerp(-260, 300, RM ? ease(fp) : easeOutBack(fp)), bx = 960, bs = 1, brot = 0;
    var bop = RM ? ease(fp) : cl(fp * 3);
    if (!RM) {
      var env = win(t, 2.4, 4.2, .3) + win(t, 6, 7.8, .3);
      bx += 5 * env * Math.sin(2 * Math.PI * 2.8 * t);
      brot = .8 * env * Math.sin(2 * Math.PI * 2.8 * t + 1);
    }
    var mp = ease(seg(t, 11, 12.2));
    bx = lerp(bx, TOP.x, mp); by = lerp(by, TOP.y, mp); bs = lerp(1, TOP.s, mp);
    block.setAttribute('transform', tr(bx, by, bs, brot));
    block.setAttribute('opacity', bop.toFixed(3));
    cracks.setAttribute('opacity', (seg(t, 10.4, 10.9) * (1 - seg(t, 11.6, 12))).toFixed(3));
    var tt = seg(t, 40.4, 40.9);
    topTick.setAttribute('opacity', tt.toFixed(3));
    topTick.setAttribute('transform', 'translate(500 -100) scale(' + (1.6 * (RM ? 1 : Math.max(.001, easeOutBack(tt)))).toFixed(4) + ')');

    // Piezas
    PIECES.forEach(function(P, i){
      var ap = ease(seg(t, APPEAR(i), APPEAR(i) + .8));
      P.line.setAttribute('stroke-dashoffset', (1 - ap).toFixed(4));
      P.line.setAttribute('opacity', ap > 0 ? 1 : 0);
      var x = lerp(TOP.x, PX(i), ap), y = lerp(TOP.y + 65, PIECE_Y, ap);
      var W = WORK(i);
      var h = win(t, W, W + 1.7, .2);
      P.g.setAttribute('transform', tr(x, y, lerp(.4, 1, ap) * (1 + .05 * h)));
      P.g.setAttribute('opacity', ap.toFixed(3));
      P.hl.setAttribute('opacity', h.toFixed(3));
      var d = seg(t, W + 1.2, W + 1.6);
      P.done.setAttribute('opacity', d.toFixed(3));
      P.t1.setAttribute('opacity', (1 - d).toFixed(3));
      P.t2.setAttribute('opacity', d.toFixed(3));
      P.icon.setAttribute('opacity', (.35 + .65 * d).toFixed(3));
      var tk = seg(t, W + 1.2, W + 1.6);
      P.tick.setAttribute('transform', tr(PW / 2 - 8, -PH / 2 + 8, RM ? 1 : easeOutBack(tk)));
      P.tick.setAttribute('opacity', tk.toFixed(3));
      // Chispa que lleva la pieza a la pantalla de juego
      var sp = seg(t, W + .5, W + 1.25), es = ease(sp);
      var x0 = PX(i), y0 = PIECE_Y - PH / 2, x1 = TARGET[i][0], y1 = TARGET[i][1];
      var cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - 200;
      var qx = (1 - es) * (1 - es) * x0 + 2 * (1 - es) * es * cx + es * es * x1;
      var qy = (1 - es) * (1 - es) * y0 + 2 * (1 - es) * es * cy + es * es * y1;
      P.spark.setAttribute('cx', qx.toFixed(1)); P.spark.setAttribute('cy', qy.toFixed(1));
      P.spark.setAttribute('opacity', (sp > 0 && sp < 1 ? Math.min(1, sp * 6, (1 - sp) * 6) : 0).toFixed(3));
    });

    // Pantalla de juego
    var sp0 = ease(seg(t, 19.4, 20.4));
    screen.setAttribute('transform', 'translate(' + SCR.cx + ' ' + SCR.cy + ') scale(' + (RM ? 1 : lerp(.94, 1, sp0)).toFixed(4) + ') translate(' + (-SCR.cx) + ' ' + (-SCR.cy) + ')');
    screen.setAttribute('opacity', sp0.toFixed(3));
    function appear(i){ return ease(seg(t, WORK(i) + 1.2, WORK(i) + 1.9)); }
    function pop(i){ return RM ? 1 : lerp(.6, 1, appear(i)); }

    // Personaje: aparece y, cuando el juego cobra vida, va a por la manzana
    var a0 = appear(0), run = ease(seg(t, 36.8, 39.4));
    var rx = lerp(TARGET[0][0], TARGET[1][0], run);
    var gb = RM ? 1 : 1 + .02 * Math.sin(t * 2 * Math.PI / 2.4 + 1);
    GROBOT.g.setAttribute('transform', tr(rx, TARGET[0][1], pop(0) * gb, 90));
    GROBOT.g.setAttribute('opacity', a0.toFixed(3));
    GROBOT.eyes.setAttribute('transform', blink(t, 2.9));

    // Premio: la manzana; desaparece al cogerla
    var eat = seg(t, 39.1, 39.5);
    gApple.setAttribute('transform', tr(TARGET[1][0], TARGET[1][1], pop(1) * (1 - eat)));
    gApple.setAttribute('opacity', (appear(1) * (1 - eat)).toFixed(3));
    var sk = seg(t, 39.3, 40.1);
    APPLE_SPARKS.forEach(function(s, k){
      var a = k * Math.PI / 3 - Math.PI / 2, dist = 30 + 50 * ease(sk);
      s.setAttribute('transform', tr(TARGET[1][0] + Math.cos(a) * dist, TARGET[1][1] + Math.sin(a) * dist, .9));
      s.setAttribute('opacity', (sk > 0 && sk < 1 ? 1 - sk : 0).toFixed(3));
    });

    // Enemigo: meteorito que flota despacio
    var my = RM ? 0 : 10 * Math.sin(t * 1.6), mr = RM ? 0 : (t * 18) % 360;
    gMeteor.setAttribute('transform', tr(TARGET[2][0], TARGET[2][1] + my, pop(2), mr));
    gMeteor.setAttribute('opacity', appear(2).toFixed(3));

    // Puntos
    var pts = t >= 39.5 ? 1 : 0, ptxt = 'Puntos: ' + pts;
    if (ptxt !== lastPts) { gPtsT.textContent = ptxt; lastPts = ptxt; }
    var ph = win(t, 39.5, 41.5, .3);
    var ps = pop(3) * (RM ? 1 : 1 + .12 * (1 - seg(t, 39.5, 40)) * (t >= 39.5 ? 1 : 0));
    gPts.setAttribute('transform', 'translate(' + TARGET[3][0] + ' ' + TARGET[3][1] + ') scale(' + ps.toFixed(4) + ') translate(' + (-TARGET[3][0]) + ' ' + (-TARGET[3][1]) + ')');
    gPts.setAttribute('opacity', appear(3).toFixed(3));
    gPtsHl.setAttribute('opacity', ph.toFixed(3));

    // Final: cartel «¡Has ganado!»; se aparta mientras se juega y vuelve al ganar
    var w1 = appear(4) * (1 - seg(t, 36, 36.4)), w2 = ease(seg(t, 41, 41.6));
    var wo = Math.max(w1, w2);
    gWin.setAttribute('transform', tr(TARGET[4][0], TARGET[4][1], t < 38 ? pop(4) : (RM ? 1 : lerp(.6, 1, w2))));
    gWin.setAttribute('opacity', wo.toFixed(3));

    // Confeti al ganar (no con «reducir movimiento»)
    var showConf = !RM && t > CONF_T && t < CONF_T + 2.4;
    CONF.forEach(function(c){
      var tau = t - CONF_T - c.delay;
      if (!showConf || tau <= 0) { c.el.setAttribute('opacity', 0); return; }
      var x = SCR.cx + c.vx * tau, y = SCR.cy - 40 + c.vy * tau + 560 * tau * tau;
      c.el.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + (c.r0 + c.spin * tau).toFixed(1) + ')');
      c.el.setAttribute('opacity', (1 - seg(tau, 1.6, 2.1)).toFixed(3));
    });

    // Textos finales
    var fa = seg(t, 44.4, 45.2) * (1 - seg(t, 49.6, 50.2));
    finalA.style.opacity = fa;
    finalA.style.transform = RM ? 'none' : 'translateY(' + (20 * (1 - seg(t, 44.4, 45.2))).toFixed(1) + 'px)';
    var fb = seg(t, 50.2, 51);
    finalB.style.opacity = fb;
    finalB.style.transform = RM ? 'none' : 'translateY(' + (20 * (1 - fb)).toFixed(1) + 'px)';

    // Subtítulos
    var sub = null, sop = 0;
    for (var s2 = 0; s2 < SUBS.length; s2++) {
      var S = SUBS[s2];
      if (t >= S[0] && t <= S[1]) { sub = S[2]; sop = Math.min(seg(t, S[0], S[0] + .25), 1 - seg(t, S[1] - .25, S[1])); break; }
    }
    if (sub !== lastSub) { subSpan.textContent = sub || ''; lastSub = sub; }
    subSpan.style.display = sub ? '' : 'none';
    subBox.style.opacity = sop;
  }

  /* ================= Escalado 16:9 ================= */
  var stage = $('stage');
  function fit(){
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  /* ================= Reproductor ================= */
  var T = 0, playing = false, rate = 1, pausasOn = false, last = null;
  var bar = $('bar'), playB = $('play'), startOv = $('start'), qBox = $('question'), againB = $('again');
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>';

  function fmt(s){ s = Math.floor(s + 1e-6); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  var marks = $('marks');
  CHAPTERS.forEach(function(c){
    if (c.t === 0) return;
    var d = document.createElement('div'); d.className = 'tick'; d.style.left = (c.t / DUR * 100) + '%'; d.title = c.titulo; marks.appendChild(d);
  });
  PAUSAS.forEach(function(p){
    var d = document.createElement('div'); d.className = 'pm'; d.style.left = (p.t / DUR * 100) + '%'; d.title = p.pregunta; marks.appendChild(d);
  });

  var lastIcon = null;
  function ui(){
    var icon = playing ? 'pause' : 'play';
    if (icon !== lastIcon) {
      playB.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
      playB.setAttribute('aria-label', playing ? 'Pausa' : 'Reproducir');
      lastIcon = icon;
    }
    var pct = (T / DUR * 100) + '%';
    $('fill').style.width = pct; $('knob').style.left = pct;
    $('time').textContent = fmt(T) + ' / ' + fmt(DUR);
    var ch = CHAPTERS[0];
    CHAPTERS.forEach(function(c){ if (T >= c.t) ch = c; });
    $('chap').textContent = ch.titulo;
    $('track').setAttribute('aria-valuenow', Math.round(T));
  }
  function setT(x){ T = cl(x, 0, DUR); render(T); ui(); }

  function hideOverlays(){ startOv.classList.add('hide'); qBox.classList.add('hide'); againB.classList.add('hide'); }
  function showEnd(){ if (!EXPORT) againB.classList.remove('hide'); }

  function play(){
    if (playing) return;
    if (T >= DUR - 1e-3) T = 0;
    hideOverlays();
    playing = true; last = null; ui(); showBar();
    requestAnimationFrame(tick);
  }
  function pause(){ playing = false; ui(); showBar(); }
  function toggle(){ playing ? pause() : play(); }
  function tick(now){
    if (!playing) return;
    if (last === null) last = now;
    var dt = Math.min(.1, (now - last) / 1000) * rate;
    last = now;
    var nt = T + dt;
    if (pausasOn && !EXPORT) {
      for (var i = 0; i < PAUSAS.length; i++) {
        var p = PAUSAS[i];
        if (T < p.t && nt >= p.t) {
          setT(p.t); playing = false; ui();
          qBox.querySelector('.q').textContent = p.pregunta;
          qBox.classList.remove('hide');
          showBar();
          return;
        }
      }
    }
    if (nt >= DUR) { setT(DUR); playing = false; ui(); showEnd(); showBar(); return; }
    setT(nt);
    if (barShown && !overBar && performance.now() > hideAt) hideBar();
    requestAnimationFrame(tick);
  }
  function jump(d){
    hideOverlays();
    setT(T + d);
    if (!playing && T >= DUR) showEnd();
  }
  function restart(){ hideOverlays(); setT(0); playing = false; play(); }

  // Barra que se oculta sola mientras se reproduce
  var barShown = true, hideAt = 0, overBar = false;
  function showBar(){
    if (EXPORT) return;
    bar.classList.remove('hidden'); document.body.classList.remove('nocursor');
    barShown = true; hideAt = performance.now() + 2600;
  }
  function hideBar(){
    if (!playing) return;
    bar.classList.add('hidden'); document.body.classList.add('nocursor'); barShown = false;
  }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(function(ev){ document.addEventListener(ev, showBar, { passive: true }); });
  bar.addEventListener('pointerenter', function(){ overBar = true; });
  bar.addEventListener('pointerleave', function(){ overBar = false; showBar(); });

  // Barra de progreso: tocar o arrastrar
  var track = $('track'), dragging = false, wasPlaying = false;
  function seekFromEvent(e){
    var r = track.getBoundingClientRect();
    setT(cl((e.clientX - r.left) / r.width) * DUR);
  }
  track.addEventListener('pointerdown', function(e){
    dragging = true; wasPlaying = playing; playing = false;
    hideOverlays(); track.setPointerCapture(e.pointerId); seekFromEvent(e);
  });
  track.addEventListener('pointermove', function(e){ if (dragging) seekFromEvent(e); });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    if (wasPlaying && T < DUR) play(); else { ui(); if (T >= DUR) showEnd(); }
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  // Botones
  playB.addEventListener('click', toggle);
  $('bigplay').addEventListener('click', play);
  $('restart').addEventListener('click', restart);
  againB.addEventListener('click', restart);
  Array.prototype.forEach.call(document.querySelectorAll('.seg .cb'), function(b){
    b.addEventListener('click', function(){
      rate = parseFloat(b.getAttribute('data-rate'));
      Array.prototype.forEach.call(document.querySelectorAll('.seg .cb'), function(o){ o.setAttribute('aria-pressed', o === b); });
    });
  });
  var pz = $('pz');
  pz.addEventListener('click', function(){
    pausasOn = !pausasOn;
    pz.setAttribute('aria-checked', pausasOn);
    document.body.classList.toggle('pausas', pausasOn);
    if (!pausasOn) qBox.classList.add('hide');
  });
  var root = document.documentElement, fsB = $('fs');
  fsB.addEventListener('click', function(){
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { var req = root.requestFullscreen || root.webkitRequestFullscreen; if (req) req.call(root); }
  });
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsB.classList.add('hide');
  document.addEventListener('fullscreenchange', fit);

  // Teclado: espacio = reproducir/pausa; ← → = 5 s; Inicio = volver a empezar
  addEventListener('keydown', function(e){
    if (EXPORT || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); jump(5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(-5); }
    else if (e.key === 'Home') { e.preventDefault(); restart(); }
    else return;
    showBar();
  });
  addEventListener('keyup', function(e){ if (e.code === 'Space' || e.key === ' ') e.preventDefault(); });

  /* ================= API para la grabación ================= */
  window.ANIM = {
    duration: DUR,
    chapters: CHAPTERS,
    pausas: PAUSAS,
    seek: function(t){ playing = false; hideOverlays(); setT(+t || 0); if (T >= DUR) showEnd(); },
    play: play,
    pause: pause
  };

  if (EXPORT) { bar.classList.add('hide'); startOv.classList.add('hide'); }
  setT(0);
})();
</script>
</body>
</html>
