<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrada y salida · Código Escuela 4.0</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fbfbf8}
  body{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#1a1d24;-webkit-user-select:none;user-select:none}
  body.nocursor{cursor:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fbfbf8;overflow:hidden}
  #scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
  svg text{font-family:system-ui,"Segoe UI",Arial,sans-serif}
  .layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:44px;padding:0 140px 120px}
  #finalA .big{font-size:84px;font-weight:800;line-height:1.15;max-width:1500px;text-wrap:balance}
  #finalB .key{font-size:104px;font-weight:800;line-height:1.15;color:#2c5bbf;background:#fff;border-radius:44px;
    padding:44px 76px;box-shadow:0 14px 44px rgba(26,29,36,.12);text-wrap:balance}

  /* Subtítulos */
  #sub{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;pointer-events:none}
  body.export #sub{bottom:56px}
  #sub span{text-wrap:balance;max-width:1560px;font-size:56px;font-weight:600;line-height:1.25;color:#fff;background:rgba(26,29,36,.8);
    border-radius:20px;padding:14px 38px;text-align:center}

  /* Pantalla de inicio */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:rgba(251,251,248,.78)}
  #start h1{margin:0;font-size:132px;font-weight:800;letter-spacing:-.01em}
  #start p{margin:0;font-size:40px;color:#4a4f5c;font-weight:600}
  #bigplay{width:230px;height:230px;border-radius:50%;border:none;background:#2c5bbf;color:#fff;cursor:pointer;
    box-shadow:0 14px 40px rgba(44,91,191,.35);display:flex;align-items:center;justify-content:center}
  #bigplay svg{width:110px;height:110px;margin-left:14px}

  /* Pausa para pensar */
  #question{position:absolute;left:220px;right:220px;bottom:150px;background:#fff;border:7px solid #f5c518;border-radius:40px;
    padding:12px 40px 14px;text-align:center;box-shadow:0 16px 50px rgba(26,29,36,.22)}
  #question .tag{font-size:28px;font-weight:800;color:#6c44b0;letter-spacing:.06em;text-transform:uppercase}
  #question .q{text-wrap:balance;font-size:54px;font-weight:800;line-height:1.15;margin:2px 0 4px}
  #question .hint{font-size:28px;color:#4a4f5c;font-weight:600}

  /* Volver a ver */
  #again{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);height:96px;padding:0 48px;border:none;border-radius:48px;
    background:#2c5bbf;color:#fff;font:inherit;font-size:40px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(44,91,191,.3)}

  /* Barra de control */
  #bar{position:absolute;left:0;right:0;bottom:0;height:150px;padding:14px 40px 18px;color:#fff;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(rgba(26,29,36,0),rgba(26,29,36,.72) 28%,rgba(26,29,36,.9))}
  #bar.hidden{opacity:0;pointer-events:none}
  #track{position:relative;height:40px;cursor:pointer;touch-action:none}
  #rail{position:absolute;left:0;right:0;top:13px;height:14px;border-radius:7px;background:rgba(255,255,255,.28);overflow:hidden}
  #fill{height:100%;width:0;background:#f5c518}
  .tick{position:absolute;top:7px;width:5px;height:26px;margin-left:-2px;border-radius:3px;background:#fff;opacity:.9}
  .pm{position:absolute;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#df7619;border:3px solid #fff;display:none}
  body.pausas .pm{display:block}
  #knob{position:absolute;top:4px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #row{display:flex;align-items:center;gap:16px;height:76px}
  .cb{height:72px;min-width:72px;padding:0 18px;border:none;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;
    font:inherit;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
  .cb svg{width:36px;height:36px}
  .cb:hover{background:rgba(255,255,255,.24)}
  .cb:focus-visible,#bigplay:focus-visible,#again:focus-visible{outline:5px solid #f5c518;outline-offset:3px}
  #play{min-width:96px;background:#2c5bbf}
  #time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:190px}
  #chap{flex:1;font-size:28px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:18px;padding:4px}
  .seg .cb{height:64px;background:transparent;border-radius:14px}
  .seg .cb[aria-pressed="true"]{background:#fff;color:#1a1d24}
  #pz .sw,#snd .sw{width:64px;height:36px;border-radius:18px;background:rgba(255,255,255,.35);position:relative;flex:none}
  #pz .sw::after,#snd .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff}
  #pz[aria-checked="true"] .sw,#snd[aria-checked="true"] .sw{background:#2a8f4f}
  #pz[aria-checked="true"] .sw::after,#snd[aria-checked="true"] .sw::after{left:32px}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="stage">

      <radialGradient id="ledG"><stop offset="0" stop-color="#cf3f36" stop-opacity=".7"/><stop offset="1" stop-color="#cf3f36" stop-opacity="0"/></radialGradient>
      <g id="robotArt"><ellipse cx="30" cy="54" rx="19" ry="4" fill="rgba(0,0,0,.18)"/><rect x="6" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="46" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="11" y="13" width="38" height="38" rx="11" fill="#2c5bbf" stroke="#1b3f8f" stroke-width="2.5"/><rect x="15" y="17" width="30" height="10" rx="5" fill="#ffffff" opacity=".18"/><path d="M22 13L30 1L38 13Z" fill="#f5c518" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/><circle cx="23" cy="29" r="5.5" fill="#fff"/><circle cx="37" cy="29" r="5.5" fill="#fff"/><circle cx="23" cy="27.5" r="2.6" fill="#1a1d24"/><circle cx="37" cy="27.5" r="2.6" fill="#1a1d24"/><path d="M23 41Q30 46 37 41" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>

        <rect x="-14" y="-92" width="28" height="92" rx="14"/>
        <rect x="-50" y="-150" width="100" height="84" rx="34"/>
        <rect x="-62" y="-196" width="124" height="60" rx="18" fill="#2c5bbf" stroke="#1b3f8f"/>

      <g id="miniFlag"><rect x="-12" y="-14" width="4" height="28" rx="2" fill="#1a1d24"/><path d="M-8 -13C0 -17 6 -9 14 -12V2C6 5 0 -3 -8 1Z" fill="#2a8f4f"/></g>
      <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9aebb"/></marker>
    </defs>

    <g id="world">
      <g id="panels"></g>
      <g id="arrows" fill="none" stroke="#a9aebb" stroke-width="12" stroke-linecap="round">
        <path id="arr1" d="M626 466H690" marker-end="url(#arr)"/>
        <path id="arr2" d="M1226 466H1290" marker-end="url(#arr)"/>
      </g>
      <g id="prog"></g>
      <g id="ex1"></g>
      <g id="ex2"></g>
      <g id="ex3"></g>
      <g id="ball"></g>
    </g>
  </svg>

  <div id="finalA" class="layer">
    <div class="big"><span style="color:#2c5bbf">Entrada</span> → <span style="color:#df7619">programa</span> → <span style="color:#2a8f4f">salida</span>.</div>
  </div>
  <div id="finalB" class="layer">
    <svg width="170" height="170" viewBox="0 0 60 60" aria-hidden="true"><use href="#robotArt"/></svg>
    <div class="key">«Algo entra, el programa decide, algo sale.»</div>
  </div>

  <div id="sub" aria-live="polite"><span></span></div>

  <div id="start">
    <h1>Entrada y salida</h1>
    <button id="bigplay" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg></button>
    <p>Código Escuela 4.0 · Primaria</p>
  </div>

  <div id="question" class="hide" role="dialog" aria-live="assertive">
    <div class="tag">Pausa para pensar</div>
    <div class="q"></div>
    <div class="hint">Pulsa ▶ para continuar</div>
  </div>

  <button id="again" class="hide">↺ Volver a ver</button>

  <div id="bar">
    <div id="track" role="slider" aria-label="Progreso del vídeo" tabindex="-1">
      <div id="rail"><div id="fill"></div></div>
      <div id="marks"></div>
      <div id="knob"></div>
    </div>
    <div id="row">
      <button class="cb" id="play" aria-label="Reproducir"></button>
      <button class="cb" id="restart" aria-label="Volver a empezar" title="Volver a empezar">
        <svg viewBox="0 0 24 24"><path d="M12 5V1.5L6.5 6 12 10.5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
      </button>
      <div id="time">0:00 / 0:00</div>
      <div id="chap"></div>
      <div class="seg" role="group" aria-label="Velocidad">
        <button class="cb" data-rate="0.75" aria-pressed="false">0,75×</button>
        <button class="cb" data-rate="1" aria-pressed="true">1×</button>
      </div>
      <button class="cb" id="snd" role="switch" aria-checked="false"><span class="sw"></span>Sonido</button>
      <button class="cb" id="pz" role="switch" aria-checked="false"><span class="sw"></span>Pausas para pensar</button>
      <button class="cb" id="fs" aria-label="Pantalla completa" title="Pantalla completa">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
<script>

  // Efectos de sonido: [segundo, tipo] (o [segundo, 'timbre', duración]). Los tipos están en el bloque «Sonido».
  var SONIDOS = [
    [10.0, 'clic'], [13.4, 'paso'], [21.5, 'clic'], [25.0, 'nota'], [41.2, 'luz'], [50.12, 'clave']
  ];

  /* ================= Utilidades ================= */
  function cl(x, a, b){ if (a === undefined) { a = 0; b = 1; } return x < a ? a : x > b ? b : x; }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function seg(t, a, b){ return cl((t - a) / (b - a)); }
  function ease(p){ return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function win(t, a, b, f){ f = f || .15; return Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b)); }
  function tr(x, y, s, r){ return 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')' + (r ? ' rotate(' + r.toFixed(2) + ')' : '') + (s !== undefined ? ' scale(' + Math.max(s, .001).toFixed(4) + ')' : ''); }
  function along(pts, p){

  }

  var ROBOT_A = '<ellipse cx="30" cy="54" rx="19" ry="4" fill="rgba(0,0,0,.18)"/><rect x="6" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="46" y="18" width="8" height="24" rx="3" fill="#1a1d24"/><rect x="11" y="13" width="38" height="38" rx="11" fill="#2c5bbf" stroke="#1b3f8f" stroke-width="2.5"/><rect x="15" y="17" width="30" height="10" rx="5" fill="#ffffff" opacity=".18"/><path d="M22 13L30 1L38 13Z" fill="#f5c518" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/><g class="eyes"><circle cx="23" cy="29" r="5.5" fill="#fff"/><circle cx="37" cy="29" r="5.5" fill="#fff"/><circle cx="23" cy="27.5" r="2.6" fill="#1a1d24"/><circle cx="37" cy="27.5" r="2.6" fill="#1a1d24"/></g><path d="M23 41Q30 46 37 41" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>';
  var ROBOT_B = '<ellipse cx="30" cy="54" rx="19" ry="4" fill="rgba(0,0,0,.14)"/><rect x="6" y="18" width="8" height="24" rx="2" fill="#1a1d24"/><rect x="46" y="18" width="8" height="24" rx="2" fill="#1a1d24"/><rect x="11" y="13" width="38" height="38" rx="7" fill="#2c5bbf"/><rect x="17" y="24" width="26" height="6" rx="3" fill="#1a1d24"/><circle cx="37" cy="27" r="1.8" fill="#4fa3d9"/><rect x="17" y="38" width="26" height="2" rx="1" fill="#fff" opacity=".35"/><path d="M23 13L30 3L37 13Z" fill="#f5c518"/>';

  /* ================= Paneles ================= */
  var PANELS = [['ENTRADA', '#2c5bbf', 110], ['PROGRAMA', '#df7619', 710], ['SALIDA', '#2a8f4f', 1310]].map(function(P){
    var g = el('g', {}, $('panels'));
    el('rect', { x: P[2], y: 150, width: 500, height: 560, rx: 30, fill: '#fff', stroke: '#d6d9e0', 'stroke-width': 3, filter: A ? 'url(#sh)' : '' }, g);
    el('path', { d: 'M' + P[2] + ' 180Q' + P[2] + ' 150 ' + (P[2] + 30) + ' 150H' + (P[2] + 470) + 'Q' + (P[2] + 500) + ' 150 ' + (P[2] + 500) + ' 180V222H' + P[2] + 'Z', fill: P[1] }, g);

  }
  var gear = el('g', {}, $('prog'));
  el('path', { d: gearD(A ? 112 : 26, A ? 92 : 20, 12), fill: A ? '#df7619' : '#fff', stroke: A ? '#1a1d24' : 'none', 'stroke-opacity': .3, 'stroke-width': 3, 'stroke-linejoin': 'round' }, gear);

  function gearAngle(t){ var a = 24 * t; PROC.forEach(function(w){ a += 540 * ease(seg(t, w[0], w[1])); }); return a; }

  // Bloques (solo B)
  function measure(e){ try { return e.getComputedTextLength(); } catch (err) { return e.textContent.length * 15; } }
  function row(parent, x, cy, parts, color){

      if (p.flag) { el('use', { href: '#miniFlag', transform: 'translate(' + (cx + 16) + ' ' + cy + ') scale(1.1)' }, parent); cx += 36; }

        var w3 = Math.max(42, measure(e3) + 22); r3.setAttribute('width', w3); e3.setAttribute('x', cx + w3 / 2); cx += w3 + 9;

      'V' + (y + h - 10) + 'Q' + (x + w) + ' ' + (y + h) + ' ' + (x + w - 10) + ' ' + (y + h) + 'H' + (x + 54) + 'l-7 7H' + (x + 29) + 'l-7 -7H' + (x + 10) +
      'Q' + x + ' ' + (y + h) + ' ' + x + ' ' + (y + h - 10) + 'V' + (y + 10) + 'Q' + x + ' ' + y + ' ' + (x + 10) + ' ' + y + 'Z';
  }
  function hatPath(x, y, w, h){

        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0), s = 7;
        for (var i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; }
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function env(g, t, a, peak, dur){
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    }
    function tone(t, f0, f1, dur, type, peak){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      env(g, t, .008, peak, dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
    }
    function noise(t, dur, freq, q, peak, ftype){
      var n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      n.buffer = noiseBuf; f.type = ftype || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      env(g, t, .004, peak, dur); n.connect(f); f.connect(g); g.connect(out); n.start(t); n.stop(t + dur + .05);
    }
    var KIT = {
      paso:    function(t){ tone(t, 620, 420, .09, 'triangle', .22); },
      giro:    function(t){ tone(t, 420, 760, .16, 'sine', .1); },
      desliza: function(t){ tone(t, 330, 560, .28, 'sine', .08); },
      aparece: function(t){ tone(t, 900, 1350, .07, 'sine', .07); },
      clic:    function(t){ noise(t, .03, 2600, 1.2, .25); tone(t, 1400, 1400, .025, 'square', .03); },
      bien:    function(t){ tone(t, 880, 880, .12, 'sine', .13); tone(t + .1, 1320, 1320, .22, 'sine', .13); },
      punto:   function(t){ tone(t, 988, 988, .08, 'square', .045); tone(t + .08, 1319, 1319, .28, 'square', .045); },
      mal:     function(t){ tone(t, 240, 120, .3, 'triangle', .2); },
      duda:    function(t){ tone(t, 440, 440, .13, 'sine', .1); tone(t + .14, 560, 560, .2, 'sine', .1); },
      exito:   function(t){ [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(t + i * .09, f, f, .35, 'triangle', .1); }); },
      clave:   function(t){ tone(t, 783.99, 783.99, 1.4, 'sine', .07); tone(t, 1174.66, 1174.66, 1.2, 'sine', .04); },
      nota:    function(t){ tone(t, 261.63, 261.63, .6, 'triangle', .25); tone(t, 523.25, 523.25, .4, 'sine', .06); },
      aplauso: function(t){ [0, .012, .03].forEach(function(d){ noise(t + d, .05, 1300, .9, .5); }); },
      luz:     function(t){ tone(t, 520, 1040, .22, 'sine', .08); tone(t + .05, 780, 1560, .2, 'sine', .04); },
      apaga:   function(t){ tone(t, 1040, 520, .22, 'sine', .07); },
      pitido:  function(t){ tone(t, 1900, 1900, .05, 'square', .025); },
      coche:   function(t){ noise(t, 1.4, 500, .7, .05, 'lowpass'); },
      cae:     function(t){ tone(t, 140, 55, .25, 'sine', .3); noise(t, .08, 300, .8, .12, 'lowpass'); },
      crack:   function(t){ noise(t, .12, 3200, 1.5, .12); },
      timbre:  function(t, dur){
        var g = ctx.createGain(), am = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.035, t + .05);
        g.gain.setValueAtTime(.035, t + dur - .25); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        am.gain.value = .5; lg.gain.value = .5; lfo.frequency.value = 22;
        lfo.connect(lg); lg.connect(am.gain); am.connect(g); g.connect(out);
        [1450, 2150].forEach(function(f){ var o = ctx.createOscillator(); o.frequency.value = f; o.connect(am); o.start(t); o.stop(t + dur + .05); });
        lfo.start(t); lfo.stop(t + dur + .05);
      }
    };
    return {
      get on(){ return on; },
      set: function(v){ on = !!v; try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) { /* sin almacenamiento */ } if (on) ac(); else this.hush(); },
      prime: function(){ if (on && !EXPORT) ac(); },
      hush: function(){ if (!ctx || !out) return; out.gain.setTargetAtTime(.0001, ctx.currentTime, .03); bus(); },
      // suena lo que hay entre a y b (solo avances normales de la reproducción, no saltos)
      cross: function(a, b, r){
        if (!on || EXPORT || !(b > a) || b - a > .3 || !ac()) return;
        SONIDOS.forEach(function(c){ if (c[0] > a && c[0] <= b && KIT[c[1]]) KIT[c[1]](ctx.currentTime + .01, (c[2] || 2) / (r || 1)); });
      }
    };
  })();

  /* ================= Reproductor ================= */
  var T = 0, playing = false, rate = 1, pausasOn = false, last = null;
  var bar = $('bar'), playB = $('play'), startOv = $('start'), qBox = $('question'), againB = $('again');
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>';

  function fmt(s){ s = Math.floor(s + 1e-6); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  var marks = $('marks');
  CHAPTERS.forEach(function(c){
    if (c.t === 0) return;
    var d = document.createElement('div'); d.className = 'tick'; d.style.left = (c.t / DUR * 100) + '%'; d.title = c.titulo; marks.appendChild(d);
  });
  PAUSAS.forEach(function(p){
    var d = document.createElement('div'); d.className = 'pm'; d.style.left = (p.t / DUR * 100) + '%'; d.title = p.pregunta; marks.appendChild(d);
  });

  var lastIcon = null;
  function ui(){
    var icon = playing ? 'pause' : 'play';
    if (icon !== lastIcon) {
      playB.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
      playB.setAttribute('aria-label', playing ? 'Pausa' : 'Reproducir');
      lastIcon = icon;
    }
    var pct = (T / DUR * 100) + '%';
    $('fill').style.width = pct; $('knob').style.left = pct;
    $('time').textContent = fmt(T) + ' / ' + fmt(DUR);
    var ch = CHAPTERS[0];
    CHAPTERS.forEach(function(c){ if (T >= c.t) ch = c; });
    $('chap').textContent = ch.titulo;
    $('track').setAttribute('aria-valuenow', Math.round(T));
  }
  function setT(x){ var a = T; T = cl(x, 0, DUR); render(T); ui(); if (playing) SND.cross(a, T, rate); }

  function hideOverlays(){ startOv.classList.add('hide'); qBox.classList.add('hide'); againB.classList.add('hide'); }
  function showEnd(){ if (!EXPORT) againB.classList.remove('hide'); }

  function play(){
    if (playing) return;
    if (T >= DUR - 1e-3) T = 0;
    SND.prime();
    hideOverlays();
    playing = true; last = null; ui(); showBar();
    requestAnimationFrame(tick);
  }
  function pause(){ playing = false; SND.hush(); ui(); showBar(); }
  function toggle(){ playing ? pause() : play(); }
  function tick(now){
    if (!playing) return;
    if (last === null) last = now;
    var dt = Math.min(.1, (now - last) / 1000) * rate;
    last = now;
    var nt = T + dt;
    if (pausasOn && !EXPORT) {
      for (var i = 0; i < PAUSAS.length; i++) {
        var p = PAUSAS[i];
        if (T < p.t && nt >= p.t) {
          setT(p.t); playing = false; ui();
          qBox.querySelector('.q').textContent = p.pregunta;
          qBox.classList.remove('hide');
          showBar();
          return;
        }
      }
    }
    if (nt >= DUR) { setT(DUR); playing = false; ui(); showEnd(); showBar(); return; }
    setT(nt);
    if (barShown && !overBar && performance.now() > hideAt) hideBar();
    requestAnimationFrame(tick);
  }
  function jump(d){
    hideOverlays();
    setT(T + d);
    if (!playing && T >= DUR) showEnd();
  }
  function restart(){ hideOverlays(); setT(0); playing = false; play(); }

  // Barra que se oculta sola mientras se reproduce
  var barShown = true, hideAt = 0, overBar = false;
  function showBar(){
    if (EXPORT) return;
    bar.classList.remove('hidden'); document.body.classList.remove('nocursor');
    barShown = true; hideAt = performance.now() + 2600;
  }
  function hideBar(){
    if (!playing) return;
    bar.classList.add('hidden'); document.body.classList.add('nocursor'); barShown = false;
  }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(function(ev){ document.addEventListener(ev, showBar, { passive: true }); });
  bar.addEventListener('pointerenter', function(){ overBar = true; });
  bar.addEventListener('pointerleave', function(){ overBar = false; showBar(); });

  // Barra de progreso: tocar o arrastrar
  var track = $('track'), dragging = false, wasPlaying = false;
  function seekFromEvent(e){
    var r = track.getBoundingClientRect();
    setT(cl((e.clientX - r.left) / r.width) * DUR);
  }
  track.addEventListener('pointerdown', function(e){
    dragging = true; wasPlaying = playing; playing = false; SND.hush();
    hideOverlays(); track.setPointerCapture(e.pointerId); seekFromEvent(e);
  });
  track.addEventListener('pointermove', function(e){ if (dragging) seekFromEvent(e); });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    if (wasPlaying && T < DUR) play(); else { ui(); if (T >= DUR) showEnd(); }
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  // Botones
  playB.addEventListener('click', toggle);
  $('bigplay').addEventListener('click', play);
  $('restart').addEventListener('click', restart);
  againB.addEventListener('click', restart);
  Array.prototype.forEach.call(document.querySelectorAll('.seg .cb'), function(b){
    b.addEventListener('click', function(){
      rate = parseFloat(b.getAttribute('data-rate'));
      Array.prototype.forEach.call(document.querySelectorAll('.seg .cb'), function(o){ o.setAttribute('aria-pressed', o === b); });
    });
  });
  var pz = $('pz');
  pz.addEventListener('click', function(){
    pausasOn = !pausasOn;
    pz.setAttribute('aria-checked', pausasOn);
    document.body.classList.toggle('pausas', pausasOn);
    if (!pausasOn) qBox.classList.add('hide');
  });
  var sndB = $('snd');
  function sndUI(){ sndB.setAttribute('aria-checked', SND.on); }
  sndB.addEventListener('click', function(){ SND.set(!SND.on); sndUI(); });
  sndUI();
  var root = document.documentElement, fsB = $('fs');
  fsB.addEventListener('click', function(){
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { var req = root.requestFullscreen || root.webkitRequestFullscreen; if (req) req.call(root); }
  });
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsB.classList.add('hide');
  document.addEventListener('fullscreenchange', fit);

  // Teclado: espacio = reproducir/pausa; ← → = 5 s; Inicio = volver a empezar
  addEventListener('keydown', function(e){
    if (EXPORT || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); jump(5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(-5); }
    else if (e.key === 'Home') { e.preventDefault(); restart(); }
    else return;
    showBar();
  });
  addEventListener('keyup', function(e){ if (e.code === 'Space' || e.key === ' ') e.preventDefault(); });

  /* ================= API para la grabación ================= */
  window.ANIM = {
    duration: DUR,
    chapters: CHAPTERS,
    pausas: PAUSAS,
    seek: function(t){ playing = false; hideOverlays(); setT(+t || 0); if (T >= DUR) showEnd(); },
    play: play,
    pause: pause
  };

  if (EXPORT) { bar.classList.add('hide'); startOv.classList.add('hide'); }
  setT(0);
})();
</script>
</body>
</html>
